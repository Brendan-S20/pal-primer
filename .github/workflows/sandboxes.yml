name: Sandboxes

# ── WHAT THIS IS FOR ──────────────────────────────────────────────────────
#
# `ci.yml` runs the checks that need nothing but a checkout: types, unit tests,
# a build, the dead-machinery scan, and five questions asked of the LIVE
# database. This file runs the two things that need a machine with something
# RUNNING on it, which is why neither existed until now:
#
#   1. A Postgres built from the migrations alone, so the three
#      tests/integration/*.db.test.ts files can execute. They self-skip without
#      TEST_SUPABASE_*, and nothing has ever set those in CI — so a suite of
#      RLS and portal-auth backstops written against real policies has been
#      reported as "skipped" on every run since it was committed.
#
#   2. A real browser at four real widths. Every responsive rule in CLAUDE.md
#      is enforced by STATIC analysis of JSX today. That catches what it was
#      built for and cannot catch a layout that simply overflows — the working
#      agreement says as much: "a green test run is not a substitute for
#      opening the page at 360px."
#
# ── WHY IT IS NOT PART OF ci.yml ──────────────────────────────────────────
#
# Both jobs are minutes slower than the whole of `verify`, and both need
# software the runner may not have (Docker, the Supabase CLI, a browser). Tying
# PR feedback to them would make the common case wait on the rare one. So this
# runs on main and on demand, and reports its prerequisites loudly instead of
# dying on a confusing ENOENT three steps in — the same shape as the `Find
# psql` step in ci.yml, and for the same reason.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      # Binary attachments and screenshots that no test, build or job reads.
      # docs/**/*.md is NOT ignored: about twenty tests read docs/ prose.
      - "**/*.docx"
      - "docs/**/*.png"
      - "docs/**/*.jpg"
      - "docs/**/*.jpeg"
      - "docs/**/*.gif"
      - "docs/**/*.webp"
  # ── A MIGRATION USED TO REACH main BEFORE ANYTHING REPLAYED IT ──────────
  #
  # This workflow ran on push-to-main and manual dispatch only, so the one
  # check that can answer "do these files BUILD a database from nothing" ran
  # AFTER the merge that made them main's problem. A migration PR went green
  # on CI -- which compares the repo to a database that already exists -- and
  # said nothing at all about the replay. Every migration merged this month
  # was verified either by remembering to dispatch this by hand, or not at all.
  #
  # Scoped by path, because that is the whole cost argument: this job needs
  # Docker and several minutes, and the overwhelming majority of PRs do not
  # touch a migration. The ones that do are exactly the ones that cannot be
  # judged without it.
  #
  # ── AND A VIEWPORT SPEC USED TO REACH main BEFORE ANY BROWSER RAN IT ────
  #
  # The same hole, one level up, found on 2026-09-10. The filter below
  # admitted migrations and nothing else, so a PR editing
  # tests/viewports/**.spec.ts did not start this workflow at all. #194 -- a
  # fix TO a viewport spec, for a failure this workflow had reported on main
  # -- went green on ci.yml, which does not run a browser, and had to be
  # dispatched by hand to be tested at all.
  #
  # tests/the-sweeps-are-not-the-whole-suite.test.ts already asserts every
  # spec is named by some step here. That is necessary and was not
  # sufficient: being named by a step means nothing on a PR the workflow
  # never runs on.
  #
  # playwright.config.ts is in the list for the same reason. It carries the
  # timeouts, the retry count and the dev-server wiring, so a change to it
  # changes the outcome of every spec without touching one.
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/proofs/**"
      - "tests/integration/*.db.test.ts"
      - "tests/run-db-tests.sh"
      - "tests/e2e/**"
      - "playwright.e2e.config.ts"
      - "tests/viewports/**"
      - "playwright.config.ts"
      - ".github/workflows/sandboxes.yml"

# ── CANCEL SUPERSEDED PULL-REQUEST RUNS, NEVER main ─────────────────────
#
# A pull request's runs share one group per ref and a newer push cancels the
# older run: nobody needs the result for a commit that is no longer the head.
# Every other event (push to main, manual dispatch) gets a group of its own
# run id, so it is never cancelled -- not even while pending, which a shared
# group with cancel-in-progress: false would still do to a queued run.
concurrency:
  group: sandboxes-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── GIT ON A RUNNER THAT RUNS AS A SERVICE ─────────────────────────────
#
# The Windows runner now runs as a service account (NETWORK SERVICE), while
# its workspace was first created by the interactive user. Git then refuses
# every command in the checkout ("detected dubious ownership"), and every
# step after actions/checkout that calls git fails: the renormalise step, the
# changed-files gate, and the tests that read `git ls-files`. checkout adds
# safe.directory only to its own temporary config, so it does not carry over.
# This adds it for every step of every job, through git's environment config,
# without writing anything to the runner's own git config.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

defaults:
  run:
    # Each Windows job adds Git Bash to PATH in its first step.
    shell: bash

jobs:
  # ── WHY A GATE JOB RATHER THAN A WIDER FILTER ──────────────────────────
  #
  # `paths` is a property of the WORKFLOW, not of a job, so widening it to
  # admit viewport PRs would also start the Docker replay on them, and the
  # browser sweep on every migration PR. The second of those is what the
  # `viewports` job's old `if:` existed to prevent, and that reasoning is
  # still right: a browser has nothing to say about a .sql file.
  #
  # So each job asks whether ITS OWN inputs changed. On push and on manual
  # dispatch both run, unconditionally -- the filter never applied there.
  #
  # This job must FAIL rather than answer "no" when it cannot tell. A gate
  # that emits an empty output skips both jobs and reports the workflow
  # green, which is the failure this whole file exists to stop happening
  # somewhere else. Hence `set -euo pipefail`, an explicit diff check, and
  # the assertion that both answers are literally true or false.
  changes:
    name: What this change can affect
    # This job only needs git and bash: Git for Windows provides both on the
    # PC, and the Mac has them natively.
    # ── EITHER SELF-HOSTED RUNNER (helm/ci-minutes) ─────────────────────
    #
    # Plain `self-hosted` matches BOTH DESKTOP-JUC6SL1 and Mac0s, so whichever
    # machine is online and idle takes this job. Every step is portable: the
    # Git Bash PATH step and the line-ending steps run only when
    # runner.os == 'Windows'. PORTABLE_RUNNER_JSON (a repository variable,
    # JSON) moves it without a commit:
    #   '["self-hosted","Windows","X64"]'  back to the PC only
    #   '"ubuntu-latest"'                  GitHub-hosted (billed minutes)
    runs-on: ${{ fromJSON(vars.PORTABLE_RUNNER_JSON || '["self-hosted"]') }}
    timeout-minutes: 10
    outputs:
      database: ${{ steps.decide.outputs.database }}
      viewports: ${{ steps.decide.outputs.viewports }}
    steps:
      # Git Bash is installed but not on the runner's PATH. Add it so the
      # bash step below resolves.
      - name: Put Git Bash on PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      - uses: actions/checkout@v4
        with:
          # The diff below needs the base commit, which a shallow clone of the
          # PR merge ref does not carry.
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            echo "$EVENT is not a pull request, so the path filter never applied: both jobs run."
            echo "database=true"  >> "$GITHUB_OUTPUT"
            echo "viewports=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "::error::the pull_request payload carried no base/head sha, so nothing could be compared"
            exit 1
          fi

          if ! changed=$(git diff --name-only "$BASE...$HEAD"); then
            echo "::error::git diff $BASE...$HEAD failed, so which files changed is unknown"
            exit 1
          fi

          if [ -z "$changed" ]; then
            echo "::error::the diff is empty, which cannot be true of a pull request that started this workflow"
            exit 1
          fi

          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          database=false
          viewports=false
          while IFS= read -r f; do
            case "$f" in
              # The E2E suite runs inside the database job (it needs the
              # stack that job builds), so its inputs route there too.
              supabase/migrations/*|supabase/proofs/*)     database=true ;;
              tests/integration/*.db.test.ts)              database=true ;;
              tests/run-db-tests.sh)                       database=true ;;
              tests/e2e/*|playwright.e2e.config.ts)        database=true ;;
              tests/viewports/*|playwright.config.ts)      viewports=true ;;
              # The workflow itself changes what both jobs DO, so it runs both.
              .github/workflows/sandboxes.yml)             database=true; viewports=true ;;
            esac
          done <<< "$changed"

          for v in "$database" "$viewports"; do
            case "$v" in
              true|false) ;;
              *) echo "::error::a gate answered '$v', which is neither true nor false"; exit 1 ;;
            esac
          done

          echo "database=$database"   >> "$GITHUB_OUTPUT"
          echo "viewports=$viewports" >> "$GITHUB_OUTPUT"
          echo "database=$database, viewports=$viewports"

  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    name: A database built from the migrations alone
    # Follows CI_RUNNER exactly like ci.yml — see docs/self-hosted-runner.md.
    # Deleting that repository variable puts this back on hosted runners.
    # ── THIS JOB CANNOT RUN ON WINDOWS ──────────────────────────────────
    #
    # A second self-hosted runner joined on 2026-09-16 and it is a Windows
    # machine. `CI_RUNNER` is `self-hosted`, which matches BOTH, so GitHub
    # dispatches to whichever is idle. The steps below need a Unix shell and
    # Unix tooling -- psql, Docker, the Supabase CLI, or a bash guard -- and
    # would fail on that box in a way that reads like a broken migration
    # rather than a broken match.
    #
    # `UNIX_RUNNER` is checked FIRST and set to `macOS`, a label only the Mac
    # carries. `CI_RUNNER` stays as the fallback so the existing escape hatch
    # is untouched: clear both variables and everything returns to hosted
    # runners with no edit to this file.
    #
    # ci.yml's `verify` job deliberately does NOT have this line. Every step
    # in it is `npm run` and portable, which is the point -- it is the long
    # one, and the whole reason for a second machine.
    runs-on: ${{ vars.UNIX_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache on HOSTED runners only. On the self-hosted machines the
          # runner's own ~/.npm persists between jobs, so the GitHub cache adds
          # nothing -- and its POST-RUN SAVE is what has now killed three
          # otherwise-green jobs: every work step succeeds, then the save
          # crawls on a machine at 90%+ swap until the job's timeout cancels
          # it, and the check reports failure over bookkeeping. The expression
          # reads empty (= caching off) whenever a self-hosted runner variable
          # is set, and 'npm' on the hosted fallback, where a fresh VM really
          # does need the cache.
          cache: ${{ (vars.UNIX_RUNNER || vars.CI_RUNNER) == '' && 'npm' || '' }}
      - run: npm ci

      - name: Find Docker and the Supabase CLI
        id: prereq
        run: |
          missing=""
          docker info >/dev/null 2>&1 || missing="$missing docker"
          command -v supabase >/dev/null 2>&1 || missing="$missing supabase"
          if [ -n "$missing" ]; then
            echo "::error::Missing on this runner:$missing"
            echo "  Docker Desktop must be INSTALLED AND RUNNING — 'docker info' failing while"
            echo "  the binary exists means the daemon is not up, which is the usual case on a"
            echo "  laptop that has just rebooted."
            echo "  Supabase CLI:  brew install supabase/tap/supabase"
            exit 1
          fi
          echo "docker and supabase are both present"

          # ── ROOM TO WORK IS A PREREQUISITE LIKE THE OTHER TWO ───────────
          #
          # Read what this can and cannot do before trusting it. On
          # 2026-08-29 the runner's disk filled and BOTH jobs died inside
          # `Set up job`, before step one, with
          #
          #     System.IO.IOException: No space left on device :
          #     '.../actions-runner/_diag/Worker_….log'
          #
          # No step can catch that: the worker crashed writing its own log.
          # This check cannot have prevented that run and does not claim to.
          #
          # What it catches is the approach — a disk with room to start a job
          # but not to finish one. That case otherwise surfaces as a cryptic
          # failure several minutes in: a half-pulled image layer, an ENOSPC
          # from initdb, a `db reset` that dies mid-replay and gets read as a
          # migration fault. Naming it here is the same trade the docker and
          # supabase checks above already make.
          #
          # 15 GiB because a cold start of this job is the whole Supabase
          # stack — thirteen images plus a fresh Postgres volume — and the
          # cache is empty exactly when someone has just cleared the disk,
          # which is to say right after the failure this guards against.
          avail_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          if [ "$avail_kb" -lt 15728640 ]; then
            echo "::error::Only $((avail_kb / 1048576)) GiB free on the runner; this job needs 15 GiB"
            echo "  Docker's virtual disk is the usual growth vector and does not shrink on its"
            echo "  own: 'docker system prune -a --volumes' frees space INSIDE the VM, but the"
            echo "  .raw file keeps the blocks it has already claimed."
            exit 1
          fi
          echo "$((avail_kb / 1048576)) GiB free"

          # ── AND ROOM IN MEMORY, WHICH IS WHAT ACTUALLY BIT US ───────────
          #
          # This WARNS and never fails, deliberately. Read why before
          # changing it to an error.
          #
          # On 2026-09-15 this runner was measured at 15.4 GB of swap used of
          # 16.4 GB -- 94% -- with 277 million swapouts and a load average of
          # 59-73 on 8 cores, after 17 days uptime. That one condition produced
          # EIGHT failures in a single day that all looked like code: five
          # viewport specs failing on timeouts or stability assertions, and
          # three builds dying with SIGBUS. Every one was re-run and passed.
          # One sent somebody down a wrong diagnosis about a search bar that
          # had nothing to do with it.
          #
          # Vite, esbuild and rolldown read through mmap. When the kernel
          # cannot back a memory-mapped page -- which is what an exhausted swap
          # file means -- the access raises SIGBUS, not ENOMEM. That is why
          # "✓ built in 9.24s" is followed by "Bus error: 10": the build
          # finished and the teardown touched a page that no longer existed.
          #
          # Failing here would be the wrong trade. The condition is not caused
          # by the diff, so blocking the diff on it adds a ninth failure mode
          # to a machine that already manufactures eight. What is worth having
          # is the number IN THE LOG, so the next unexplained timeout is an
          # explained one. docs/owner-actions-before-submission.md §12 is the
          # write-up.
          #
          # macOS has vm.swapusage; Linux runners have /proc/meminfo. If
          # neither is readable this says so rather than passing quietly -- an
          # unrun check and a clean one must not look alike.
          # Portable: Git Bash on Windows has neither getconf nor uptime, and
          # every probe below is allowed to come back empty rather than fail.
          cores=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo "?")
          load1=$(uptime 2>/dev/null | sed -E 's/.*averages?:[[:space:]]*//' | awk '{gsub(",",""); print $1}')
          [ -n "$load1" ] || load1="?"
          if swap=$(sysctl -n vm.swapusage 2>/dev/null); then
            used=$(echo "$swap" | awk '{gsub("M","",$6); print $6}')
            total=$(echo "$swap" | awk '{gsub("M","",$3); print $3}')
            pct=$(awk -v u="$used" -v t="$total" 'BEGIN{printf "%d", (t>0? u*100/t : 0)}')
            echo "swap ${pct}% used (${used}M of ${total}M), load ${load1} on ${cores} cores"
            if [ "$pct" -ge 50 ]; then
              echo "::warning::Swap is ${pct}% full on this runner (${used}M of ${total}M), load ${load1} on ${cores} cores. Timeouts, stability-assertion failures and SIGBUS in this run are more likely to be the machine than the diff -- re-run once before believing any of them. See docs/owner-actions-before-submission.md §12."
            fi
          elif [ -r /proc/meminfo ]; then
            st=$(awk '/SwapTotal/{print $2}' /proc/meminfo)
            sf=$(awk '/SwapFree/{print $2}' /proc/meminfo)
            if [ "${st:-0}" -gt 0 ]; then
              pct=$(awk -v t="$st" -v f="$sf" 'BEGIN{printf "%d", (t-f)*100/t}')
              echo "swap ${pct}% used, load ${load1} on ${cores} cores"
              [ "$pct" -ge 50 ] && echo "::warning::Swap is ${pct}% full on this runner, load ${load1} on ${cores} cores. Treat timeouts and SIGBUS here as suspect and re-run once. See docs/owner-actions-before-submission.md §12."
            else
              echo "no swap configured; load ${load1} on ${cores} cores"
            fi
          else
            echo "::warning::could not read swap usage on this runner (no vm.swapusage, no /proc/meminfo), so memory pressure was NOT checked for this run"
          fi

      # `db reset` drops the local database and replays supabase/migrations/
      # from nothing. That is a stronger claim than anything in ci.yml, which
      # only ever compares the repo against a database built incrementally over
      # a year plus 82 baselined files. If a migration only ever worked because
      # of the state that preceded it, this is where it fails.
      # ── WHY THIS RETRIES, AND WHY ONLY FOR ONE FAILURE ──────────────────
      #
      # `db reset` does two things: replay the migrations, then restart the
      # stack. The restart races the API gateway coming back up, and the CLI's
      # health poll reports
      #
      #     Error status 502: An invalid response was received from the
      #     upstream server
      #
      # Seen on 2026-08-15 on two of three consecutive runs, ALWAYS after the
      # last migration had applied — so the part this job exists to test had
      # already passed each time, and the job reported failure anyway.
      #
      # A retry is only honest if it cannot mask the thing being tested. So a
      # genuine migration fault exits immediately: the retry is reachable only
      # when the log shows the restart was reached. Retrying a failed
      # migration three times would turn this job into a slower version of
      # nothing, which is the opposite of why it was built.
      #
      # ── THAT USED TO BE SPELLED AS A 5xx, AND THE RACE HAS MORE THAN ONE
      #    SPELLING ────────────────────────────────────────────────────────
      #
      # The guard below matched `Error status 5[0-9][0-9]` and nothing else.
      # On 2026-08-29 the same race arrived as a CLIENT-side timeout instead:
      #
      #     failed to execute http request: Get
      #     "http://127.0.0.1:54321/storage/v1/bucket": context deadline
      #     exceeded (Client.Timeout exceeded while awaiting headers)
      #
      # No 5xx anywhere in it — the CLI stopped waiting before storage
      # answered, and storage came up healthy 43 seconds later. All 612
      # migrations had applied with zero errors. The old guard would have
      # taken the other branch and printed "failed on a migration", accusing
      # the migrations of a fault that is not theirs, which is precisely the
      # misreport this block exists to prevent.
      #
      # So the discriminator is no longer the error text, which nobody can
      # enumerate in advance. `db reset` applies every migration BEFORE it
      # restarts anything, so "Restarting containers..." in the log means the
      # replay — the only thing this job tests — already finished. A migration
      # fault aborts before that line is ever printed, and still exits here.
      # ── AND WHY `supabase start` NEEDED THE SAME TREATMENT ──────────────
      #
      # The loop below was written for the restart race and sat one line too
      # far down. `supabase start` ran ABOVE it, bare, under `bash -e`: when the
      # stack would not come up the step died on the CLI's own message and none
      # of the diagnosis below ever printed.
      #
      # Which is exactly what happened on 2026-09-01. Docker on the runner could
      # not bring supabase_db to a healthy state:
      #
      #     Starting database...
      #     supabase_db_<ref> container is not ready: unhealthy
      #
      # Three runs failed that way — twice on a PR and once on a dispatched run
      # against main, which is how it was established as the runner rather than
      # the change. None of them retried, and none of them printed "this is the
      # runner, not the migrations", because that sentence lives after a loop
      # the failure never reached. The retry written for precisely this class of
      # problem did not cover the step that hits it.
      #
      # So startup retries too, on its own terms: a stop between attempts,
      # because a half-started stack is the usual reason the next start fails,
      # and a message that names Docker so nobody has to read three logs to
      # find out the machine is unwell.
      #
      # ── AND WHY THAT PARAGRAPH USED TO END WITH SOMETHING FALSE ─────────
      #
      # It said: "The migration guarantee is untouched — this loop only ever
      # runs BEFORE any migration is replayed, so it cannot mask a migration
      # fault." That is wrong, and it cost a cycle on 2026-09-03 to find out.
      # `supabase start` brings up a FRESH stack, and bringing up a fresh stack
      # replays supabase/migrations/ as part of starting it. So a migration
      # with a syntax error fails HERE, three times, twenty seconds apart, and
      # is then reported as:
      #
      #     the stack would not start three times running — this is the runner,
      #     not the migrations
      #
      # which is the exact opposite of true, on a job that takes eight minutes
      # and queues behind everything else on one runner. The real error —
      # "unterminated dollar-quoted string ... (SQLSTATE 42601)" — was four
      # lines above it in the log and contradicted by the banner beneath.
      #
      # The loop now reads the log it already tees. A SQLSTATE or an "At
      # statement:" is Postgres refusing the SQL, which no amount of restarting
      # will change, so it exits at once with the CLI's own message — the same
      # principle the reset loop below has always applied, now applied one step
      # earlier. Anything else is still the runner and still retries. The
      # reset loop still exits
      # immediately on one.
      # ── CI GETS ITS OWN PORTS AND ITS OWN PROJECT ID ─────────────────────
      #
      # supabase/config.toml puts the local stack on 54421-54427, and until
      # 2026-09-19 this job read that file verbatim ON THE SAME MACHINE the
      # E2E suite develops on — the runner is also somebody's development
      # machine. So `npm run test:e2e` could not run while this job was
      # running: both called `supabase start` against the same ports AND the
      # same project_id, so the second either lost the port bind or, worse,
      # quietly adopted the first one's containers.
      #
      # This step gives THIS CHECKOUT its own range (54521-54527) and its own
      # project id (`<id>-ci`), which is what actually separates the two
      # stacks: the CLI names every container, volume and network after
      # project_id, so a distinct id means a distinct stack rather than a
      # shared one on different ports. The developer copy of config.toml is
      # untouched — this edits the runner's throwaway checkout, which the next
      # `actions/checkout` resets.
      #
      # It fails loudly if the patch found nothing to change: a silent no-op
      # here (say, after config.toml moves to a different range) puts both
      # stacks back on shared ports, which is the exact collision this exists
      # to end. Nothing downstream hardcodes a port — run-db-tests.sh, the
      # proofs step and the E2E harness all read `supabase status`.
      - name: Give this job its own Supabase ports and project id
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const path = "supabase/config.toml";
          const before = fs.readFileSync(path, "utf8");
          let ports = 0;
          let after = before.replace(/\b544([0-9][0-9])\b/g, (_, d) => {
            ports += 1;
            return `545${d}`;
          });
          const withId = after.replace(
            /^project_id = "([^"]+)"/m,
            'project_id = "$1-ci"',
          );
          if (ports === 0 || withId === after) {
            console.error(
              "::error::config.toml no longer matches what this step patches " +
                `(ports rewritten: ${ports}, project_id rewritten: ${withId !== after}). ` +
                "A no-op here silently puts CI back on the developer's ports and " +
                "project id — the collision this step exists to end. Update the " +
                "patterns here to match the new config.toml.",
            );
            process.exit(1);
          }
          fs.writeFileSync(path, withId);
          console.log("CI stack isolated from the developer's:");
          console.log(withId);
          EOF

      - name: Replay every migration into an empty database
        run: |
          set -o pipefail
          started=""
          for attempt in 1 2 3; do
            if supabase start 2>&1 | tee "start-$attempt.log"; then
              started=yes
              break
            fi
            # Postgres refused the SQL. Retrying is not going to change its
            # mind, and the "this is the runner" banner below would be a lie.
            if grep -qE 'SQLSTATE|At statement:' "start-$attempt.log"; then
              echo "::error::a migration was refused while the stack came up — this is the SQL, not the runner. The CLI's own error is above; a fresh stack replays supabase/migrations/ as part of starting."
              exit 1
            fi
            # Somebody else's stack owns the port. Same reasoning as the clause
            # above, for the same reason: retrying cannot help, and the banner
            # at the bottom would send you to `docker info`, which succeeds.
            #
            # Found on 2026-09-15. This job failed three times running with
            #
            #     Bind for 0.0.0.0:54322 failed: port is already allocated
            #
            # and the real cause was a DIFFERENT Supabase project's stack —
            # ref eqzmqxtngbulzhimrymr — that had been up on the runner for five
            # hours holding 54321-54327. `supabase stop` below could never have
            # cleared it, because it only stops the project in this directory.
            #
            # Deliberately NOT `supabase stop --all`: the runner is also
            # somebody's development machine, and a CI job that kills whatever
            # else is running on it is a worse failure than the one it fixes.
            # So this reports the truth and stops, and a human decides whether
            # to free the ports or give this project its own in config.toml.
            if grep -qE 'port is already allocated|Bind for 0\.0\.0\.0:' "start-$attempt.log"; then
              echo "::error::a local Supabase port is already in use — this is NOT the migrations and NOT Docker being unhealthy. Another stack on this machine is holding a port this job patched itself onto. This job runs on 54521-54527 (the step above rewrites config.toml so CI never shares 54421-54427 with the developer's own stack or 54321-54327 with other projects); find the holder with lsof -iTCP:54522 -sTCP:LISTEN and 'docker ps --format \"{{.Names}}\t{{.Ports}}\" | grep supabase'. The usual cause is a previous run of THIS job whose 'Stop the stack' step never ran."
              exit 1
            fi
            echo "::warning::supabase start failed (attempt $attempt of 3); stopping the stack and retrying"
            supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 20
          done
          if [ -z "$started" ]; then
            echo "::error::the stack would not start three times running — this is the runner, not the migrations. Check Docker on the runner: 'docker info' should succeed and supabase_db must reach healthy."
            exit 1
          fi
          for attempt in 1 2 3; do
            if supabase db reset --local 2>&1 | tee "reset-$attempt.log"; then
              echo "migrations replayed from empty on attempt $attempt"
              exit 0
            fi
            if ! grep -qF 'Restarting containers...' "reset-$attempt.log"; then
              echo "::error::db reset failed on a migration, not on the container restart"
              exit 1
            fi
            echo "::warning::every migration applied; the restart raced the stack coming back (attempt $attempt of 3); retrying"
            sleep 15
          done
          echo "::error::the stack failed to come back three times running — this is the runner, not the migrations"
          exit 1

      - name: The RLS and portal-auth backstops, finally executed
        run: npm run test:db

      # ── AND THE PROOFS, WHICH THIS WORKFLOW WATCHED WITHOUT RUNNING ─────
      #
      # `supabase/proofs/**` has been in this file's `paths:` filter and in the
      # `changes` gate since they were written, so editing a proof has always
      # started this job. Nothing in the job ever executed one. A proof could
      # have rotted at any point in the three weeks since 2026-08-25 and the
      # only signal would have been a green tick.
      #
      # They are not migrations and cannot be. A migration's own `DO $verify$`
      # asserts what the file ESTABLISHES from any starting state; a proof acts
      # out an exploit, which needs a tenant, a technician and a visit that a
      # replay into an empty database does not have. Each one builds its own
      # fixture and ends in ROLLBACK, so they leave nothing behind and can run
      # in any order against the database the step above just built.
      #
      # ON_ERROR_STOP=1 because psql's default is to keep going after an error
      # and exit 0, which would make this step a decoration.
      - name: The proofs, which are evidence rather than schema
        run: |
          set -o pipefail
          eval "$(supabase status -o env | grep -E '^DB_URL=')"
          : "${DB_URL:?supabase status did not report a DB_URL}"
          failed=0
          for f in supabase/proofs/*.sql; do
            [ -e "$f" ] || continue
            echo "── $(basename "$f")"
            if psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"; then
              echo "   ok"
            else
              echo "::error file=$f::proof failed — this is an exploit that is no longer prevented, or a fixture that no longer builds"
              failed=1
            fi
          done
          exit $failed

      # ── THE BEHAVIOURAL E2E SUITE, ON THE STACK THIS JOB JUST BUILT ──────
      #
      # Until 2026-09-19 this suite could not run in CI at all: it and this
      # job fought over one config.toml's ports and one project id. The step
      # above that patches CI onto 54521-54527 is what makes this line
      # possible, and this line is most of why that step was worth writing.
      #
      # `npm run test:e2e` reads `supabase status` from THIS checkout, so it
      # lands on the patched CI stack; it seeds a tenant through the product's
      # own seed_demo_org, starts a dev server with the local credentials, and
      # drives a browser through the QA list's round trips — mark-paid flips
      # an invoice and writes the payment row, the review queue empties and
      # the decision survives a reload, settings save and survive a refresh —
      # with RLS live. The first behavioural spec run caught a real bug
      # (settings.scheduling rendering defaults over saved values) on its
      # first execution; this step exists so the next one is caught before a
      # merge rather than after.
      #
      # It runs AFTER the proofs: those need the empty replayed schema, and
      # the seed writes a tenant into it. Order matters in one direction only.
      - name: The QA list's behavioural half, against that same database
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Keep what the E2E suite saw when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            test-results/
            e2e.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup || true

  viewports:
    name: Four real widths in a real browser
    # Not on migration PRs -- a browser sweep has nothing to say about a .sql
    # file, and running it would spend ten minutes of a single self-hosted
    # runner to re-prove what the push-to-main run already proves. That was
    # `if: github.event_name != 'pull_request'` until 2026-09-10, which bought
    # it by never running on ANY pull request, including the ones that change
    # the specs this job runs. The gate above draws the line where it was
    # always meant to be: on whether this job's own inputs moved.
    needs: changes
    if: needs.changes.outputs.viewports == 'true'
    # ── THIS JOB RUNS ON THE WINDOWS RUNNER, ON PURPOSE ──────────────────
    #
    # Until 2026-10-08 it carried the same `UNIX_RUNNER` line as the database
    # job above, under a note saying the steps "need a Unix shell and Unix
    # tooling -- psql, Docker, the Supabase CLI, or a bash guard". Only the
    # last of those was ever true of THIS job: it talks to a stubbed backend
    # (tests/viewports/fixtures/stub-backend.ts) behind a network fence, so it
    # needs no database, no Docker and no CLI. The bash guard was its disk and
    # swap check, and that is now `node scripts/runner-headroom.mjs`.
    #
    # Why it had to move rather than merely could: both jobs in this file
    # were pinned to one Mac -- the owner's laptop, measured this month at
    # 91-94% swap -- so a PR that touched both waited for them back to back,
    # and this job alone took 40-45 minutes there against a 45-minute ceiling
    # and timed out repeatedly on 2026-10-08. DESKTOP-JUC6SL1 sat idle for
    # all of it. With this line the two jobs run side by side, one per box.
    #
    # UPDATED by helm/ci-minutes: the job now takes plain `self-hosted`, so
    # it runs on whichever machine is online rather than queueing for the PC
    # for up to 24 hours. The cost is the one measured above: on the Mac it
    # has run 40-45 minutes against this 45-minute ceiling. If Mac runs time
    # out, either set VIEWPORTS_TIMEOUT_MINUTES (e.g. 60) or pin the job back
    # to the PC with PORTABLE_RUNNER_JSON = '["self-hosted","Windows","X64"]'.
    # ── EITHER SELF-HOSTED RUNNER (helm/ci-minutes) ─────────────────────
    #
    # Plain `self-hosted` matches BOTH DESKTOP-JUC6SL1 and Mac0s, so whichever
    # machine is online and idle takes this job. Every step is portable: the
    # Git Bash PATH step and the line-ending steps run only when
    # runner.os == 'Windows'. PORTABLE_RUNNER_JSON (a repository variable,
    # JSON) moves it without a commit:
    #   '["self-hosted","Windows","X64"]'  back to the PC only
    #   '"ubuntu-latest"'                  GitHub-hosted (billed minutes)
    runs-on: ${{ fromJSON(vars.PORTABLE_RUNNER_JSON || '["self-hosted"]') }}
    # 45, raised from 30 on 2026-09-14 after this job was cancelled at 30m13s
    # with the last step mid-run. Raising a ceiling is usually how a real
    # slowdown gets hidden, so here is the arithmetic it was raised against,
    # measured on the run that was cut off and on the machine these specs were
    # written on:
    #
    #   setup-node        5-7 min normally, 19m16s on the run that timed out
    #   npm ci            ~15s
    #   public sweep      ~2.0-2.5 min   (58 tests)
    #   signed-in sweep   ~3.8-4.8 min   (92 tests)
    #   one-off cases     ~7.0-9.2 min   (227 tests)
    #
    # That is 19-24 minutes of work on a healthy runner, against a 30-minute
    # budget — so the margin was already thin before anything went wrong, and
    # it got thinner honestly: the cases step gained four specs on 2026-09-13
    # and 14 (the day map, the at-a-glance row, the map fit, the trial notice)
    # and went from 219 tests to 227.
    #
    # What actually tipped it over was setup-node taking three times as long as
    # usual on a runner that threw `Bus error: 10` during `npm run build:native`
    # in the same hour. THAT is not fixed by this number and is not meant to be
    # — it is written down in the PR that raised this, and a job that keeps
    # needing 45 minutes to do 20 minutes of work is a machine to look at, not a
    # ceiling to raise again.
    #
    # ── MEASURED AGAIN ON 2026-09-17, AND BOTH NUMBERS ABOVE HAVE MOVED ──
    #
    # The figures above were taken on the machine these specs were written on.
    # The runner is now native arm64, and the same work is roughly twice as
    # fast: the one-off cases ran in 225s against the 7.0-9.2 min recorded
    # above, and the two canonical sweeps in 94s and 190s.
    #
    # setup-node moved further, and in a way worth knowing before diagnosing
    # it. On three consecutive runs it took 0s, 1s and 1s — the toolchain is
    # already on the box, so there is nothing to install. Then the run after
    # the machine was rebooted took 1205s: twenty minutes, on a cold tool and
    # npm cache, with an 89s cache save afterwards that leaves the next run
    # warm again.
    #
    # So a twenty-minute setup-node is NOT the symptom described above. The
    # paragraph above is about a runner with exhausted swap throwing SIGBUS,
    # and it is still right about that. A cold cache after a reboot looks
    # similar in the log and is self-correcting on the next run. Check which
    # one you have before treating a slow job as a sick machine.
    #
    # With the eleven-size Apple step added, the run that included the cold
    # start finished in 39m07s of the 45m ceiling. Strip the cold start and
    # the same job is about 19 minutes. The ceiling is not the thing under
    # pressure.
    #
    # ── MEASURED ON THE WINDOWS RUNNER, 2026-10-08 ────────────────────────
    #
    # It was under pressure again by October: 40-43 minutes on the Mac, and
    # cancelled at 45 more than once. Moving the job to DESKTOP-JUC6SL1 did
    # NOT fix that on its own -- the first run there was cancelled at 45m
    # inside the Apple step. The log said why: "58 tests using 1 worker",
    # "200 tests using 1 worker", "759 tests using 2 workers". Playwright
    # parallelises by FILE, each sweep is one file, so a 16-core machine ran
    # them on one core and lost to the Mac per core. The Mac had the same
    # limit and was merely slow rather than over the line. Both sweep specs
    # now say `mode: "parallel"`.
    #
    #                      Mac, 4 runs        Windows, 8 workers
    #   checkout + npm ci  ~20s               45s + 3m05s  (no warm npm tree)
    #   public sweep       1m40s - 2m20s      1m20s
    #   signed-in sweep    7m24s - 8m48s      3m59s
    #   Apple sweeps       19m52s - 25m05s    10m49s
    #   one-off cases      11m05s - 11m30s    14m25s  (file-parallel already;
    #                                                  the single dev server
    #                                                  is the limit there)
    #   whole job          40m - 43m          34m45s
    #
    # So the ceiling stays 45 with about ten minutes of margin, and the Mac
    # is free for the database job at the same time.
    #
    # ── 2026-10-09: THE TEN MINUTES WERE GONE, AND THE JOB WAS SPLIT ─────
    #
    # The one-off cases now run in `viewport-cases` below, not here. Read
    # this before putting them back or before raising this number.
    #
    # For a day every PR "failed 1 to 3 random tests" with
    # `browserContext.close: Target page, context or browser has been
    # closed`, after a `toBeVisible` or a `waitForTimeout`. Those were not
    # test failures. Each one was `Test was interrupted`, and the job's
    # annotation said why: "The job has exceeded the maximum execution time
    # of 45m0s" (job 113924415012), or, on main, "Canceling since a higher
    # priority waiting request ... exists" (114037497809). Playwright prints
    # whatever the in-flight tests were awaiting when the runner kills it, so
    # the "failures" were whichever tests were running at minute 45 -- most
    # often the 430px half of every-route-nobody-put-on-the-list and the
    # live map in the-half-of-the-product-the-customer-uses, the two longest
    # files in the last step, which is why those two kept being named. No
    # log or artifact held a crash, an out-of-memory, or a 90s test
    # timeout, and no first-visit compile ever failed a wait outright.
    #
    # The job had simply outgrown the ceiling. On this box, the same day:
    #
    #   one-off cases   14.3-14.5 min (800 tests)  at 12:34-14:27
    #                   17.2 min      (823 tests)  at 21:59, a quiet box
    #                   20.2-20.3 min (814 tests)  at 16:51 and 19:03
    #   whole job       35 min  ->  39-42 min  ->  45m00s, cancelled
    #
    # Two things moved. The cases grew -- the guided setup walked at four
    # widths has 66-84s tests, a-business-that-does-not-scoop added 22 --
    # and every test in that step got 15-20% slower beside them, while the
    # eleven-size sweep in the same jobs did not move (85 vs 87 worker-
    # minutes). And the box itself has hours where everything is half as
    # fast again: at 16:33 `npm ci` took 6m53s against its usual 3m05s in a
    # job that never opened a browser, at 19:03 every file in the cases ran
    # about 1.5x its usual time, and at 22:35 the Apple step took 17.6 min
    # against 11.1. Nothing from GitHub shares the box -- it is one runner
    # -- so that is the machine, and it is a machine to look at.
    #
    # Halving the job is what the 2026-09-17 note above said to do rather
    # than raise this: each half is about 22 minutes on a quiet box and
    # about 34 at 1.5x, with the same 45 over each. Fewer workers or a warm-up would
    # have made a slow job slower, and fixed nothing that was failing.
    #
    # VIEWPORTS_TIMEOUT_MINUTES (a repository variable) overrides the 45 while
    # these jobs run on GitHub's hosted Linux machine (2026-10-10: the PC was
    # off and VIEWPORTS_RUNNER pointed here). That machine is two cores, and
    # the full sweep was cancelled at 45 with 280 checks passed and the Apple
    # sizes still running. Delete the variable with VIEWPORTS_RUNNER when the
    # PC is back; the 45, and everything said above it, applies to the PC.
    timeout-minutes: ${{ fromJSON(vars.VIEWPORTS_TIMEOUT_MINUTES || '45') }}
    steps:
      # Git Bash is installed but not on the runner's PATH. Add it so the
      # bash default shell resolves for every later step.
      - name: Put Git Bash on PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      # ── LINE ENDINGS, BEFORE ANYTHING IS CHECKED OUT (Windows only) ──────
      #
      # The same two steps as ci.yml's windows-probe, for the same reason, and
      # the long note there is the explanation: `.gitattributes` says LF, a
      # reused workspace may hold CRLF from a checkout that predates it, and
      # `git checkout --force` will not rewrite a file whose content already
      # matches the index. Both jobs share this repo's workspace on that box.
      #
      # `if:` on the OS rather than unconditional, because the first one is
      # `git config --global`, and on the Mac fallback that is the owner's own
      # git config on his own laptop.
      - name: Make git write LF
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Renormalise a workspace checked out before .gitattributes
        if: runner.os == 'Windows'
        run: |
          git rm --cached -r -q .
          git reset --hard
          git status --porcelain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Actions cache only on a GitHub-hosted image; see ci.yml's verify.
          cache: ${{ contains(vars.PORTABLE_RUNNER_JSON || '', '-latest') && 'npm' || '' }}
      - run: npm ci

      # Same prerequisite, smaller number — see the long note in the database
      # job for what this can and cannot catch. 5 GiB rather than 15: this job
      # downloads a browser rather than thirteen container images, and writes
      # traces and screenshots only when something has already failed.
      #
      # ── AND ROOM IN MEMORY, WHICH IS WHAT ACTUALLY BIT US ───────────────
      #
      # The memory half WARNS and never fails, deliberately. On 2026-09-15 the
      # Mac was measured at 15.4 GB of swap used of 16.4 GB -- 94% -- with a
      # load average of 59-73 on 8 cores, and that one condition produced
      # EIGHT failures in a single day that all looked like code: five
      # viewport specs failing on timeouts or stability assertions, and three
      # builds dying with SIGBUS. Every one was re-run and passed. Failing on
      # it would block a diff on a condition the diff did not cause; what is
      # worth having is the number IN THE LOG.
      # docs/owner-actions-before-submission.md §12 is the write-up.
      #
      # This was forty lines of shell-specific `df`/`sysctl` probing until
      # 2026-10-08. It is now the same Node script ci.yml's `verify` uses for
      # memory, plus `--need-disk-gib` for the disk floor. Disk is a certainty
      # rather than a likelihood: a browser download that runs out of disk half
      # way reports as a layout failure on every route at every width.
      - name: Find room to work
        run: node scripts/runner-headroom.mjs --need-disk-gib 5

      # A self-hosted runner keeps its browser cache between jobs, so this is
      # usually a no-op after the first run. On Windows `--with-deps` runs
      # Playwright's media-pack script, which installs something only on
      # Windows SERVER; on a desktop edition it checks and exits.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The dev server is what gets measured, not `.output`: the web build
      # targets the cloudflare-module preset, so the server bundle is a Worker
      # rather than something node can serve. Layout comes from the same
      # Tailwind and the same components either way.
      #
      # Playwright starts that server itself and passes it the placeholder
      # Supabase values it needs to boot — see the `webServer.env` block in
      # playwright.config.ts, and the note there on why they must NOT be put in
      # a `.env` instead.
      - name: Sweep 360 / 768 / 1280 / 1920 — public routes
        run: npm run test:viewports:public

      # ── THIS WAS NOT A GATE FOR ONE DAY ──────────────────────────────────
      #
      # Added 2026-08-19 with 22 failing surface/width combinations, and run
      # `continue-on-error` so that a check which could only be red did not
      # teach people to ignore it. All 22 are now cleared — 18 were real and
      # fixed, 4 were false positives in tests/viewports/rules.ts, which could
      # not see a hit area supplied by an out-of-flow pseudo-element.
      #
      # So it is a gate, as the note it replaces said it should become. The
      # signed-in half is where every surface a customer's staff uses all day
      # actually lives; the public half only covers the marketing and auth
      # pages.
      - name: Sweep 360 / 768 / 1280 / 1920 — signed-in routes
        run: npm run test:viewports:auth

      # ── ELEVEN REAL DEVICES, AND A POINTER THAT IS NOT A MOUSE ───────────
      #
      # The two steps above are a contract; this one is a census. rules.ts
      # says so itself, and the record backs it: "every real fault found on
      # the device during the 2026-08 iOS pass was at a size not in that
      # list." 360/768/1280/1920 are four round numbers no Apple device has.
      #
      # APPLE_SIZES=1 SUBSTITUTES the width list rather than extending it —
      # 320 through 1366, with the real heights, so a short landscape
      # viewport is its own case — and sets `hasTouch`, which makes Chromium
      # report `pointer: coarse` and `hover: none`. That second half is the
      # one that matters. On 2026-08-21 a sweep reported 382 passed / 0
      # failed at iPad viewports while emulating a MOUSE, and the same code
      # failed 105 of them the moment touch was turned on.
      #
      # It is ADDITIVE, not a replacement, because the substitution loses
      # 1920 and 1280 — the Apple list stops at 1366. The desktop end still
      # needs the step above it.
      #
      # This lands green: 462 assertions, 8.4 minutes, zero failures. So it
      # is a ratchet in the same sense as
      # `tests/a-thumb-is-not-a-screen-width.test.ts` — it is not here to
      # find today's bugs, it is here because this exact regression class has
      # now shipped TWICE (#115, then #207 re-spelling the fix the variant
      # had just replaced) and was caught both times by running this by hand.
      # Nothing ran it on a schedule. `the-sweeps-are-not-the-whole-suite`
      # did not catch the gap, and could not: it asked whether every SPEC is
      # named by a step in this file, and these are the same two specs in a
      # different MODE. It now also asserts that a spec reading APPLE_SIZES is
      # selected by a step that SETS it, so deleting the step below fails that
      # rule by name rather than quietly returning this job to four widths.
      #
      # Budget (2026-09-17): the job's arithmetic above totals 19-24 minutes
      # against a 45-minute ceiling. This adds ~8, so 27-32. Still margin, and less of
      # it — if a third mode is ever added, raise the ceiling deliberately or
      # split the job rather than discovering it at 45m01s.
      #
      # It runs `:apple:sweeps`, NOT `:apple`, and the difference is eight
      # wasted minutes and a pile of images. `test:viewports:apple` is
      # `APPLE_SIZES=1 playwright test` with no filter, and only 3 of the 20
      # specs here read that variable. The other 17 are the one-off cases,
      # which ignore it and would re-run, identically, what the step below
      # already ran. The third is `app-store-screenshots`, which is on the
      # EXEMPT list in `the-sweeps-are-not-the-whole-suite` precisely because
      # it "produces the App Store Connect images on demand" — regenerating
      # those on every push to main is not a test, it is a side effect.
      #
      # So `:apple` stays what it is, the tool you run by hand, and CI gets a
      # script that names the two specs the mode actually changes. The 8.1
      # minutes above is the measured cost of THAT command; the unfiltered
      # one was never measured and should not be.
      - name: Sweep eleven Apple sizes with touch — public and signed-in
        run: npm run test:viewports:apple:sweeps

      # Screenshots and error contexts exist only for failures -- on a green
      # run this uploads nothing, which is the point. There is no trace.zip:
      # playwright.config.ts records none, and recording one for every test
      # to keep the few that fail would cost the job time it does not have.
      #
      # `cancelled()` as well as `failure()`: a job stopped at its ceiling or
      # by a newer push is CANCELLED, not failed, and until 2026-10-09 that
      # left nothing to download from exactly the runs that most needed it.
      - name: Keep what failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  viewport-cases:
    name: The one-off cases in a real browser
    # Split out of `viewports` above on 2026-10-09; the note above its
    # `timeout-minutes` has the measurements. Same gate, same runner, same
    # setup, and the same ceiling over half the work. On one Windows runner
    # the two jobs still run one after the other, so this costs one more
    # checkout and `npm ci` (about four minutes) per run, which is what it
    # costs to stop a slow hour on that box from cancelling a PR at 45m00s.
    needs: changes
    if: needs.changes.outputs.viewports == 'true'
    # ── EITHER SELF-HOSTED RUNNER (helm/ci-minutes) ─────────────────────
    #
    # Plain `self-hosted` matches BOTH DESKTOP-JUC6SL1 and Mac0s, so whichever
    # machine is online and idle takes this job. Every step is portable: the
    # Git Bash PATH step and the line-ending steps run only when
    # runner.os == 'Windows'. PORTABLE_RUNNER_JSON (a repository variable,
    # JSON) moves it without a commit:
    #   '["self-hosted","Windows","X64"]'  back to the PC only
    #   '"ubuntu-latest"'                  GitHub-hosted (billed minutes)
    runs-on: ${{ fromJSON(vars.PORTABLE_RUNNER_JSON || '["self-hosted"]') }}
    # ~17.5 min of tests plus ~4.5 of setup on a quiet box (2026-10-09),
    # and 20.3 min of tests in the slowest hour measured. If this ever needs most of 45, the
    # cases have outgrown one job too -- split them again by file, as this
    # was split from the sweeps, rather than raising it.
    #
    # VIEWPORTS_TIMEOUT_MINUTES (a repository variable) overrides the 45 while
    # these jobs run on GitHub's hosted Linux machine (2026-10-10: the PC was
    # off and VIEWPORTS_RUNNER pointed here). That machine is two cores, and
    # the full sweep was cancelled at 45 with 280 checks passed and the Apple
    # sizes still running. Delete the variable with VIEWPORTS_RUNNER when the
    # PC is back; the 45, and everything said above it, applies to the PC.
    timeout-minutes: ${{ fromJSON(vars.VIEWPORTS_TIMEOUT_MINUTES || '45') }}
    steps:
      # Git Bash is installed but not on the runner's PATH. Add it so the
      # bash default shell resolves for every later step.
      - name: Put Git Bash on PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
      # The four setup steps are the `viewports` job's, for the reasons
      # written there.
      - name: Make git write LF
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Renormalise a workspace checked out before .gitattributes
        if: runner.os == 'Windows'
        run: |
          git rm --cached -r -q .
          git reset --hard
          git status --porcelain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Actions cache only on a GitHub-hosted image; see ci.yml's verify.
          cache: ${{ contains(vars.PORTABLE_RUNNER_JSON || '', '-latest') && 'npm' || '' }}
      - run: npm ci

      - name: Find room to work
        run: node scripts/runner-headroom.mjs --need-disk-gib 5

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # ── THE SWEEPS ARE NOT ALL OF IT ─────────────────────────────────────
      #
      # The sweep steps run by filename pattern, and for five months
      # everything that did not match one of those two patterns ran nowhere.
      # Four one-off measurements had been written, merged, and never run
      # again by anything.
      #
      # `the-sweeps-are-not-the-whole-suite.test.ts` now asserts that every
      # spec under tests/viewports is named by a step in THIS FILE, or is on
      # a short exempt list with a reason, so the next one cannot go quiet.
      - name: Measure the one-off cases
        run: npm run test:viewports:cases

      # Its own name: two jobs in one run cannot upload the same artifact.
      - name: Keep what failed
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-cases-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
