name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The migration check reflects the state of the LIVE DATABASE, not of this
  # commit, so it can go stale (or newly pass) without anyone pushing anything.
  # Manual runs let you re-check after applying migrations, without inventing a
  # commit to trigger CI.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests
    # ── WHERE THIS RUNS, AND WHY IT IS A VARIABLE ─────────────────────────
    #
    # Unset — the default — means GitHub's hosted runners, exactly as before.
    # Setting the repository variable `CI_RUNNER` to `self-hosted` points CI at
    # a machine of ours instead, with no edit to this file and no commit.
    #
    # It is a variable rather than a hardcoded `self-hosted` because of how
    # Actions behaves when no matching runner is online: the job does not fail,
    # it QUEUES, and it keeps queueing for 24 hours before GitHub terminates
    # it. A laptop that is closed for the evening would turn every push — and
    # every merge to main, which is the hard migration gate — into a check that
    # sits pending overnight and then fails for a reason that has nothing to do
    # with the code. A red X is recoverable; a check that is neither red nor
    # green for a day is the kind of thing people learn to ignore.
    #
    # So the switch back is Settings → Secrets and variables → Actions →
    # Variables → delete `CI_RUNNER`. One click, no PR, effective on the next
    # run. See docs/self-hosted-runner.md.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # A hosted runner is destroyed after each job; a self-hosted one is not, so
    # a wedged step there holds the machine until someone notices. The whole
    # job takes about three minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm, not bun: package-lock.json resolves to the public registry, which
      # is reachable from CI.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm test` is `vitest run` — the whole suite, discovered.
      #
      # It used to be a hand-typed list of 48 filenames in package.json, and on
      # 2026-07-31 there were 52 test files. The four that had never been added
      # to the list had never run in CI, and one of them
      # (stripe-connect.server.test.ts) had been failing since BUILD-6 changed
      # the return shape it asserts on. CI was green the whole time, because a
      # test file CI does not name is a test file CI cannot fail on.
      #
      # Do not reintroduce a list. If a test must be excluded, exclude it in
      # vitest.config.ts where the exclusion is visible next to the discovery,
      # not by omitting a filename nobody will notice is missing.
      #
      # The three tests/integration/*.db.test.ts files self-skip unless
      # TEST_SUPABASE_URL / _ANON_KEY / _SERVICE_KEY are set, which this step
      # deliberately does not set.
      - name: Tests
        run: npm test

      # The app was never BUILT in CI — only type-checked. Two things went
      # unwatched because of it:
      #
      #   * `tsc --noEmit` does not run Vite, so a build-breaking change (a bad
      #     plugin config, an SSR-only import pulled into a client file, a
      #     failed Nitro preset) passed CI and would have surfaced at deploy.
      #
      #   * scripts/check-pwa-output.mjs is wired into `npm run build`, and it
      #     exists because /sw.js 404'd in production for the entire life of the
      #     PWA (BUG-41). It asserts against build OUTPUT, which is the only
      #     place those defects are visible. With no build step it had never run
      #     automatically once — a check written to stop a regression, that
      #     nothing invoked. It also skips silently when there is no output, so
      #     it could never have complained about its own absence.
      #
      # ~40s. Runs after the tests so a broken build is not the first thing a
      # reviewer sees when the real failure is a unit test.
      - name: Build (and verify the service worker is real)
        run: npm run build

      # IMP-11: catches the failure this project keeps producing — something
      # built, granted and correct that nothing ever calls. Six instances in one
      # cycle, every one invisible to tests and types because an uncalled
      # function is perfectly well-typed and passes every test written for it.
      #
      # A HARD gate, unlike lint: it starts green (every existing exception is
      # recorded in scripts/dead-machinery-baseline.json with its reason), so a
      # failure means something NEW was added and left unwired. It also prints
      # the known gaps on every run, green or not, so recorded debt stays visible
      # instead of disappearing the moment it is written down.
      - name: Dead machinery
        run: npm run check:dead-machinery

      # Non-blocking: the repo carries pre-existing formatting drift that is not
      # this workflow's job to gate on. Kept visible so it doesn't grow unseen.
      - name: Lint
        run: npx eslint .
        continue-on-error: true

  migrations:
    name: Migrations applied to the live database
    # ── THIS USED TO SAY "deliberately NOT following CI_RUNNER" ───────────
    #
    # It gave two reasons and both were sound: the scripts shell out to `psql`,
    # which ships on ubuntu-latest and will not be on a laptop unless somebody
    # installed it; and this is the job holding SUPABASE_DB_URL and
    # STRIPE_SECRET_KEY, which is the last place to want an environment nobody
    # can reproduce.
    #
    # What overrode both: the job stopped running at all. GitHub's HOSTED
    # allocation for this repository broke on 2026-08-10 — the same failure
    # that moved `verify` to the self-hosted runner — and this was the last job
    # left on `ubuntu-latest`. From 2026-08-12 it has been failing in two
    # seconds with `runner_id: 0`, ZERO steps and no logs at all. It never
    # receives a machine.
    #
    # That is worse than either objection above, and worse than a plain red
    # build. This is the IMP-2 gate: the check that code landing on main does
    # not depend on schema production lacks. Five merges landed while it was
    # unschedulable, six migrations were applied to the live database in that
    # window, and nothing compared the two. A hard gate that cannot start is
    # not a lenient gate — it is an absent one, and it is absent while
    # reporting failure, which is the shape that trains people to ignore it.
    #
    # ── ON THE SECRETS, PLAINLY ──────────────────────────────────────────
    #
    # Following CI_RUNNER means SUPABASE_DB_URL is decrypted on a long-lived
    # machine rather than a disposable one. That is a real change and worth
    # saying out loud rather than burying: the trade is a persistent host
    # against a gate that runs. It is the owner's own Mac, which is already
    # where that connection string lives, so this is not new exposure so much
    # as the same exposure on a box that also keeps a work directory.
    #
    # Set the repository variable `CI_RUNNER` back to empty and this returns to
    # hosted runners with no PR needed, exactly like `verify`.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Skipped on pull requests, and this costs nothing real: every step below
    # already carried `continue-on-error: ${{ github.event_name ==
    # 'pull_request' }}`, so on a PR the whole job could only ever produce
    # warnings. It was spending a runner — checkout, node, five checks — to
    # tell us something it was not allowed to fail on.
    #
    # It remains a HARD gate on main and on manual dispatch, which is where
    # the IMP-2 incident actually lives: code landing on main must not depend
    # on schema production lacks. A PR legitimately contains migrations that
    # have not been applied yet, which is why it was advisory there in the
    # first place.
    #
    # To check before merging without spending the run, the three schema
    # scripts take offline captures (--applied-from / --live-from /
    # --catalog-from). scripts/ci-local.sh documents how.
    if: github.event_name != 'pull_request'
    # IMP-2: a production incident already came from "migrations never applied
    # to the live DB". The codebase can be entirely correct while prod runs old
    # schema, and nothing surfaces it until a query fails in front of a
    # customer. This is the loud check.
    #
    # It runs on pull requests as a warning and on main as a hard gate: a PR
    # legitimately contains migrations that have not been applied yet, whereas
    # code landing on main must not depend on schema production lacks.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── FINDING psql, WHICH IS THE WHOLE REASON THIS JOB STAYED HOSTED ──
      #
      # It ships on ubuntu-latest. On a Mac it does not, and the trap is that
      # installing it is not enough either: `brew install libpq` is KEG-ONLY,
      # so it deliberately leaves psql off PATH on both architectures. Someone
      # who runs the documented install and re-runs the job still gets "psql:
      # command not found", which reads as the install having failed.
      #
      # So this looks in the places brew actually puts it rather than asking
      # anyone to edit the runner's shell profile — one `brew install libpq`
      # and nothing else. Both prefixes are checked because Apple Silicon uses
      # /opt/homebrew and Intel uses /usr/local, and a runner can move between
      # machines without this file knowing.
      #
      # It fails loudly with the exact command to run rather than letting the
      # first check die on a confusing ENOENT three steps later.
      - name: Find psql
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "psql on PATH: $(command -v psql)"
            exit 0
          fi
          for d in /opt/homebrew/opt/libpq/bin /usr/local/opt/libpq/bin \
                   /opt/homebrew/bin /usr/local/bin /Applications/Postgres.app/Contents/Versions/latest/bin; do
            if [ -x "$d/psql" ]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "found psql at $d/psql — added to PATH for the steps below"
              exit 0
            fi
          done
          echo "::error::psql not found on this runner, so the schema checks below cannot run."
          echo "On the self-hosted macOS runner:  brew install libpq"
          echo "No PATH edit is needed — this step looks in libpq's keg-only bin directory."
          echo "Checked: /opt/homebrew/opt/libpq/bin, /usr/local/opt/libpq/bin, /opt/homebrew/bin,"
          echo "         /usr/local/bin, /Applications/Postgres.app/Contents/Versions/latest/bin"
          exit 1

      - name: Check repo migrations against the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — the migration drift check cannot run."
            echo "Add it in repo Settings → Secrets → Actions. Until then this job fails by design:"
            echo "a check that silently passes without checking anything is the failure mode IMP-2 exists to remove."
            exit 1
          fi
          node scripts/check-migrations.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Check the database against the repo migrations
        # The other direction. The step above asks "did production run
        # everything the repo has"; this asks "does production have something
        # the repo never wrote". Three functions had drifted in that direction
        # undetected, one of them a SECURITY DEFINER routine reachable from a
        # shipped screen — invisible until an environment gets rebuilt from the
        # repo and it simply is not there.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — the undeclared-schema check cannot run."
            exit 1
          fi
          node scripts/check-schema-declared.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Check every object the migrations create still exists
        # IMP-2b. The two steps above compare NAMES: repo files against the
        # applied ledger, and live objects against declared ones. Neither can
        # see inside a file. 82 migrations are exempt from the name comparison
        # via migrations-baseline.json, whose comment claimed each was verified
        # by confirming the objects it creates exist — and seed_demo_org was
        # defined in two of those files and present in neither copy of the live
        # database for a month, with the app calling it by name the whole time.
        #
        # A per-FILE exemption has nowhere to record "five of the six functions
        # in this file landed". This step replays every CREATE and DROP across
        # every migration and asserts each surviving object is in the catalog,
        # so a half-applied migration is a failure rather than a rounding error.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — the per-object check cannot run."
            exit 1
          fi
          node scripts/check-baseline-objects.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: The published app origin answers the native preflight
        # §3 item 6 of the brief listed this as two curls "only you can confirm".
        # They sat unrun, and when finally run the answer was that the
        # documented host FAILS: app.houndstack.com 307-redirects to
        # www.app.houndstack.com, and a CORS preflight may not follow a redirect
        # — so the native app pointed at it cannot call a single server
        # function. The CORS work was right; the host was wrong.
        #
        # Nothing in the repo can know that. Only the live edge can, so this
        # asks it every run instead of leaving it as a step to remember.
        run: node scripts/check-app-origin.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Stripe charges what the catalog says
        # The database stores a price in cents AND a Stripe price id. The app
        # renders the cents; Stripe charges the id. Nothing compared them until
        # now, which is survivable only while the two are created together.
        #
        # It stops being survivable at the live-mode cutover: a fresh live
        # catalog is built by hand and platform_plans is repointed, and every
        # new id is a chance for the pricing page to say $79 while the card is
        # charged $199 — or for a live key to hold test ids, which does not
        # error until checkout, in front of the first paying customer.
        #
        # Exit 2 means the gate is NOT ARMED (no STRIPE_SECRET_KEY in CI yet)
        # and is reported as a warning rather than a pass, because "could not
        # check" and "checked and fine" are different answers. Exit 1 is a real
        # disagreement and fails.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set +e
          node scripts/check-stripe-catalog.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::Stripe catalog gate is NOT ARMED — add STRIPE_SECRET_KEY to repo secrets to arm it before the live-mode cutover."
            exit 0
          fi
          exit $code
        continue-on-error: ${{ github.event_name == 'pull_request' }}
