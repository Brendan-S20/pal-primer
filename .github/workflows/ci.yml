name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The migration check reflects the state of the LIVE DATABASE, not of this
  # commit, so it can go stale (or newly pass) without anyone pushing anything.
  # Manual runs let you re-check after applying migrations, without inventing a
  # commit to trigger CI.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests
    # ── WHERE THIS RUNS, AND WHY IT IS A VARIABLE ─────────────────────────
    #
    # Unset — the default — means GitHub's hosted runners, exactly as before.
    # Setting the repository variable `CI_RUNNER` to `self-hosted` points CI at
    # a machine of ours instead, with no edit to this file and no commit.
    #
    # It is a variable rather than a hardcoded `self-hosted` because of how
    # Actions behaves when no matching runner is online: the job does not fail,
    # it QUEUES, and it keeps queueing for 24 hours before GitHub terminates
    # it. A laptop that is closed for the evening would turn every push — and
    # every merge to main, which is the hard migration gate — into a check that
    # sits pending overnight and then fails for a reason that has nothing to do
    # with the code. A red X is recoverable; a check that is neither red nor
    # green for a day is the kind of thing people learn to ignore.
    #
    # So the switch back is Settings → Secrets and variables → Actions →
    # Variables → delete `CI_RUNNER`. One click, no PR, effective on the next
    # run. See docs/self-hosted-runner.md.
    # ── VERIFY IS PINNED TO UNIX TOO, AND THIS IS A RETREAT ─────────────
    #
    # It was left on the plain CI_RUNNER line on 2026-09-16 on the reasoning
    # that every STEP in this job is `npm run` or `npx` and therefore portable.
    # That was true of the steps and false of the job: 86 of 271 TEST FILES
    # fail on Windows, and the reason is not subtle --
    #
    #     expected [ 'src\components/RouteMap.tsx' ]
    #       to deeply equal [ 'src/components/RouteMap.tsx' ]
    #
    # Path separators, in a suite where a great many tests walk `src/` and
    # assert on the paths they find. A CRLF fault was found and fixed first
    # (.gitattributes, and /\r?\n/ in tests/support/sql-migrations.ts); it was
    # real and it was the smaller half.
    #
    # So this comes back to the Mac until the suite is genuinely
    # platform-agnostic. A red CI is worse than an idle runner. The work to
    # undo this is worth doing -- it is the longest job in the repo and the Mac
    # is the machine with the memory problem -- but it is a project, not a
    # line, and it should not be discovered by leaving main red.
    # ── UNPINNED 2026-09-18, AND ONLY THIS JOB ──────────────────────────
    #
    # `UNIX_RUNNER` was set to macOS because 86 of 271 test files failed on
    # Windows. They no longer do: six causes, all one rule -- a path that
    # stopped being a path and became a string that was compared, keyed,
    # printed or matched. `windows-probe` now gates that and is green.
    #
    # So this job follows `CI_RUNNER`, which matches BOTH runners, and the
    # forty-minute job runs on whichever is free. That is the point of the
    # whole exercise: the Mac was measured at 91% swap and load 86 on 8
    # cores while this was being written.
    #
    # `migrations` below is NOT unpinned and must not be. It guards
    # `SUPABASE_DB_URL` with bash `[ -z ... ]` tests and no `shell:`
    # override, and it decrypts a production credential -- where that
    # happens is a decision with more than portability in it. The database
    # job in sandboxes.yml stays for a plainer reason: Docker, psql and the
    # Supabase CLI are not on the Windows box.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # A hosted runner is destroyed after each job; a self-hosted one is not, so
    # a wedged step there holds the machine until someone notices.
    #
    # ── WHY 45 AND NOT 20 ─────────────────────────────────────────────────
    #
    # The job's own work takes about three minutes. The other forty-two are
    # for `npm ci` on a runner whose ACTIONS CACHE IS REFUSING TO AUTHENTICATE:
    #
    #     Failed to restore: Server failed to authenticate the request.
    #     Make sure the value of Authorization header is formed correctly
    #     including the signature.
    #
    # With that warning the install runs completely cold, and on 2026-08-22 it
    # was killed at the 20-minute ceiling twice in a row WITHOUT FINISHING —
    # the second time the job died inside `npm ci` itself, before a single
    # check had run. A gate that cannot install its dependencies is not a gate
    # that is failing; it is a gate that never started.
    #
    # This is not new and it is not any one branch's doing. On `main`, this job
    # has taken 4m, 5m, 18m and 21m depending on whether the cache answered,
    # and the run for #114 was cancelled at 33m32s — before the branch that
    # raised this even existed. The 20-minute ceiling has been sitting inside
    # the range of normal for a while and the cache failure pushed it over.
    #
    # NOTHING IS WEAKENED BY THIS. Every step, every assertion and every hard
    # gate is unchanged; the job is simply allowed to finish installing before
    # it is shot. The alternative of splitting the native-bundle check into its
    # own job was considered and rejected: each half would still need its own
    # `npm ci`, so it doubles the exposure to the thing actually failing.
    #
    # The real fix is upstream — the cache, or `CI_RUNNER` pointing somewhere
    # healthier (see the note above and docs/self-hosted-runner.md). This is
    # the floor that keeps the gate meaningful until then, and it should come
    # back down once a warm cache is reliable again.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache on HOSTED runners only. On the self-hosted machines the
          # runner's own ~/.npm persists between jobs, so the GitHub cache adds
          # nothing -- and its POST-RUN SAVE is what has now killed three
          # otherwise-green jobs: every work step succeeds, then the save
          # crawls on a machine at 90%+ swap until the job's timeout cancels
          # it, and the check reports failure over bookkeeping. The expression
          # reads empty (= caching off) whenever a self-hosted runner variable
          # is set, and 'npm' on the hosted fallback, where a fresh VM really
          # does need the cache.
          cache: ${{ (vars.UNIX_RUNNER || vars.CI_RUNNER) == '' && 'npm' || '' }}

      # npm, not bun: package-lock.json resolves to the public registry, which
      # is reachable from CI.
      - run: npm ci

      # ── WHAT THE MACHINE HAD LEFT WHEN THIS RAN ─────────────────────────
      #
      # Warns, never fails. It exists because the three SIGBUS builds this
      # repo has recorded were all in THIS job -- "Build (and verify the
      # service worker is real)" and "What ships inside the native binary" --
      # and nothing here reported the one condition that explains them.
      #
      # The self-hosted runner was measured on 2026-09-15 at 15.4 GB of swap
      # used of 16.4 GB, 277 million swapouts, load 59-73 on 8 cores, 17 days
      # uptime. Vite, esbuild and rolldown read through mmap; when the kernel
      # cannot back a memory-mapped page the access raises SIGBUS rather than
      # ENOMEM. That is why the log reads "✓ built in 9.24s" and then
      # "Bus error: 10" -- the build finished and the teardown touched a page
      # that no longer existed.
      #
      # It does not fail the job because the condition is not caused by the
      # diff, and on that machine eight results in one day were already false.
      # A ninth would not help. What helps is the number sitting in the log
      # above the failure, so the next person reads an explained event instead
      # of spending an afternoon on a search bar that was never involved.
      #
      # sandboxes.yml carries the same check beside its disk guard. This job
      # has no disk guard to sit beside, which is part of why the gap lasted.
      # docs/owner-actions-before-submission.md §12 is the write-up.
      # ── THE COMMENT THAT USED TO BE HERE WAS WRONG ──────────────────────
      #
      # This step was `shell: bash`, under a note asserting that Git Bash is
      # on the PATH "because actions/checkout needs it". Reasonable, and
      # false. Measured on DESKTOP-JUC6SL1 on 2026-09-18:
      #
      #     ##[error]bash: command not found
      #
      # Git IS installed there -- the logs reference
      # `C:\Program Files\Git\usr\bin\tar.exe` -- but `bash` is not on the
      # PATH the runner invokes steps with.
      #
      # That mattered the moment this job stopped being pinned to the Mac.
      # The step carries `continue-on-error` and exits zero, so on Windows it
      # would have failed GREEN: the check whose whole purpose is to put a
      # number in the log, silently putting nothing there, and its silence
      # indistinguishable from a healthy machine.
      #
      # `scripts/runner-headroom.mjs` reads swap per platform -- sysctl on
      # darwin, /proc/meminfo on linux, the pagefile on win32 -- and says so
      # explicitly when it cannot read it, because an unread number and a good
      # one must not look alike. Node is the one interpreter this job can rely
      # on, since `setup-node` ran two steps ago.
      - name: What the machine had left
        continue-on-error: true
        run: node scripts/runner-headroom.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm test` is `vitest run` — the whole suite, discovered.
      #
      # It used to be a hand-typed list of 48 filenames in package.json, and on
      # 2026-07-31 there were 52 test files. The four that had never been added
      # to the list had never run in CI, and one of them
      # (stripe-connect.server.test.ts) had been failing since BUILD-6 changed
      # the return shape it asserts on. CI was green the whole time, because a
      # test file CI does not name is a test file CI cannot fail on.
      #
      # Do not reintroduce a list. If a test must be excluded, exclude it in
      # vitest.config.ts where the exclusion is visible next to the discovery,
      # not by omitting a filename nobody will notice is missing.
      #
      # The three tests/integration/*.db.test.ts files self-skip unless
      # TEST_SUPABASE_URL / _ANON_KEY / _SERVICE_KEY are set, which this step
      # deliberately does not set.
      - name: Tests
        run: npm test

      # The app was never BUILT in CI — only type-checked. Two things went
      # unwatched because of it:
      #
      #   * `tsc --noEmit` does not run Vite, so a build-breaking change (a bad
      #     plugin config, an SSR-only import pulled into a client file, a
      #     failed Nitro preset) passed CI and would have surfaced at deploy.
      #
      #   * scripts/check-pwa-output.mjs is wired into `npm run build`, and it
      #     exists because /sw.js 404'd in production for the entire life of the
      #     PWA (BUG-41). It asserts against build OUTPUT, which is the only
      #     place those defects are visible. With no build step it had never run
      #     automatically once — a check written to stop a regression, that
      #     nothing invoked. It also skips silently when there is no output, so
      #     it could never have complained about its own absence.
      #
      # ~40s. Runs after the tests so a broken build is not the first thing a
      # reviewer sees when the real failure is a unit test.
      - name: Build (and verify the service worker is real)
        run: npm run build

      # IMP-11: catches the failure this project keeps producing — something
      # built, granted and correct that nothing ever calls. Six instances in one
      # cycle, every one invisible to tests and types because an uncalled
      # function is perfectly well-typed and passes every test written for it.
      #
      # A HARD gate, unlike lint: it starts green (every existing exception is
      # recorded in scripts/dead-machinery-baseline.json with its reason), so a
      # failure means something NEW was added and left unwired. It also prints
      # the known gaps on every run, green or not, so recorded debt stays visible
      # instead of disappearing the moment it is written down.
      - name: Dead machinery
        run: npm run check:dead-machinery

      # Customer-facing copy only, and a HARD gate: the sweep that added it
      # cleared every finding first, so a failure means new copy, not old debt.
      # /platform/*, comments, tests, placeholder cells and anything carrying an
      # `em-dash-ok:` reason are excluded by the script, not by this step.
      - name: Em dashes in customer-facing copy
        run: npm run check:em-dashes

      # WHAT ACTUALLY SHIPS INSIDE THE iOS/ANDROID BINARY.
      #
      # `build` above produces the HOSTED app; a Capacitor binary carries a
      # different artifact built a different way (SPA prerender, absolute API
      # origin, no server). Nothing in CI looked at it until now, so the class
      # of fault where a store build points at a preview host — which this
      # config was once hard-coded to do — was invisible to every check here.
      #
      # It builds the bundle rather than assuming one is lying around: every
      # assertion in the script is of the form "this string is absent", and all
      # of them pass on an empty directory.
      - name: What ships inside the native binary
        run: npm run build:native && npm run check:native-bundle

      # Does every sign-in button that a person can PRESS actually work?
      #
      # This is the only check here that leaves our own infrastructure, and it
      # exists because the one before it could not. oauthSignIn probes the
      # authorize URL and treats >= 400 as "provider not enabled" -- and Google
      # sign-in still shipped broken on 2026-08-25, because Supabase answered
      # 302. Supabase was fine. The break was one hop further on, at Google.
      #
      # Fails ONLY on a provider that is reachable and rejects us. A provider
      # switched on behind a disabled button warns, and an unreachable host is
      # UNKNOWN, so a flaky network cannot fail a build.
      - name: Every OAuth button that can be pressed
        run: npm run check:oauth

      # Non-blocking: the repo carries pre-existing formatting drift that is not
      # this workflow's job to gate on. Kept visible so it doesn't grow unseen.
      - name: Lint
        run: npx eslint .
        continue-on-error: true


  # ── A MEASUREMENT, WITH AN EXPIRY DATE ────────────────────────────────────
  #
  # This job exists to answer one question with a number: how much of the suite
  # still fails on Windows? It is NOT a gate, and `continue-on-error` below is
  # the reason it needs this comment rather than a line of it.
  #
  # ── WHY IT IS WORTH A JOB ─────────────────────────────────────────────────
  #
  # A second self-hosted runner joined on 2026-09-16 and has been idle ever
  # since, because `UNIX_RUNNER = macOS` pins every test job to the Mac. That
  # Mac was measured at 94% swap a few hours after a reboot on 2026-09-17, and
  # that condition has already manufactured eight CI failures in one day that
  # looked like code and were not. Moving the forty-minute job to the idle box
  # is the only fix that does not involve buying memory.
  #
  # What stopped it was 86 of 271 test files failing on Windows, every one of
  # them on path spelling rather than on the thing it tested:
  #
  #     expected [ "src\components/RouteMap.tsx" ] to equal [ "src/components/RouteMap.tsx" ]
  #
  # `tests/support/repo-paths.ts` now normalises that at the 21 places a built
  # path became a string. This job measures what that bought.
  #
  # ── WHY continue-on-error, AND WHAT MUST HAPPEN NEXT ──────────────────────
  #
  # Because the honest state today is "unknown on Windows", and a job that
  # turns an unknown into a red main teaches nothing the log would not. But a
  # permanently non-blocking job is exactly the shape this repo keeps finding
  # and deleting -- machinery that runs, is watched by nobody, and reads as
  # coverage. So this one is explicitly temporary and has two exits:
  #
  #   * It goes green -> delete `continue-on-error`, point `UNIX_RUNNER` at
  #     nothing, and let the long job run on whichever machine is free.
  #   * It stays red -> the failures are named in the summary below. Fix or
  #     delete this job. Do not leave it here reporting into nothing.
  #
  # `[self-hosted, Windows]` addresses DESKTOP-JUC6SL1 specifically. Plain
  # `self-hosted` matches BOTH runners and would sometimes measure the Mac,
  # which would pass and prove nothing -- the same trap as a sweep that
  # measures the login screen twenty times.
  windows-probe:
    name: How much of the suite runs on the other machine
    # No `needs:` -- ci.yml has no `changes` job (that one lives in
    # sandboxes.yml), so this runs whenever CI does. It is cheap relative to
    # what it answers, and it runs on the machine that is otherwise idle, so it
    # costs the Mac nothing.
    runs-on: [self-hosted, Windows]
    # `continue-on-error` removed 2026-09-18, on the run that came back
    # `Suites 1163 passed, 0 failed | Tests 3653 passed, 0 failed` -- the same
    # test count as macOS. The job's own comment named this as the exit
    # condition and this is it being taken.
    timeout-minutes: 60
    steps:
      # ── LINE ENDINGS, BEFORE ANYTHING IS CHECKED OUT ────────────────────
      #
      # `.gitattributes` says `* text=auto eol=lf`, and a FRESH clone honours
      # it. This runner's workspace is not fresh: it is reused between runs,
      # and `git checkout --force` will not rewrite a working file whose
      # content already matches the index. So the CRLF written by a checkout
      # that predates `.gitattributes` is still sitting there.
      #
      # It cost four of the ten remaining failures, and none of them looks
      # like a line-ending fault at the assertion:
      #
      #     indexOf('.from("subscriptions")\n      .update(')    ->  -1
      #     /export const SMS_CONSENT_TEXT =\n(.*?);\n/s.exec()  ->  null
      #
      # A test searching for a literal newline finds nothing in a file that
      # has CRLF, and vitest reports "expected -1 to be greater than -1",
      # which reads like a missing export rather than a missing carriage
      # return. That is why this is worth a comment rather than a one-liner.
      #
      # Both halves are needed. The config makes the NEXT fetch write LF; the
      # renormalise fixes a workspace that is already wrong, which the config
      # alone cannot do because git believes those files are already correct.
      - name: Make git write LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      # Re-stage every file so git re-applies .gitattributes, then restore.
      # `git status --porcelain` afterwards should print nothing; if it prints
      # a wall of modified files, THAT is the line-ending drift being fixed,
      # and it is worth seeing rather than swallowing.
      - name: Renormalise a workspace checked out before .gitattributes
        run: |
          git rm --cached -r -q .
          git reset --hard
          git status --porcelain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache on HOSTED runners only. On the self-hosted machines the
          # runner's own ~/.npm persists between jobs, so the GitHub cache adds
          # nothing -- and its POST-RUN SAVE is what has now killed three
          # otherwise-green jobs: every work step succeeds, then the save
          # crawls on a machine at 90%+ swap until the job's timeout cancels
          # it, and the check reports failure over bookkeeping. The expression
          # reads empty (= caching off) whenever a self-hosted runner variable
          # is set, and 'npm' on the hosted fallback, where a fresh VM really
          # does need the cache.
          cache: ${{ (vars.UNIX_RUNNER || vars.CI_RUNNER) == '' && 'npm' || '' }}
      # NO `shell:` ANYWHERE IN THIS JOB, AND THAT IS THE FIX.
      #
      # The first version of this job said `shell: bash` on both steps. The
      # runner answered `##[error]bash: command not found` -- Git Bash is not
      # on its PATH -- so `npm ci` never ran, the suite never ran, and the job
      # reported a failure that said nothing about Windows compatibility.
      #
      # Omitting `shell:` uses the platform default, which is PowerShell here
      # and bash on a Unix runner, and every line below is written to work in
      # both. The parsing that genuinely needed a shell now lives in Node,
      # which `setup-node` has just installed.
      #
      # Worth knowing elsewhere: `verify` has a memory-preflight step that is
      # also `shell: bash`. It is fine today because that job is pinned to
      # macOS -- but it is `continue-on-error` with `exit 0`, so if the pin
      # were ever cleared it would fail exactly like this and still read green.
      - run: npm ci

      # Redirection works in both PowerShell and bash. `continue-on-error`
      # rather than `|| true`, because `||` is not PowerShell.
      # Plain `npm test`. It said `--reporter=basic` for exactly one run, and
      # that reporter does not exist in vitest 4 -- it fails inside
      # `loadCustomReporterModule` before a single test runs, on every
      # platform. The probe therefore measured nothing twice in a row, the
      # second time for a reason that had nothing to do with Windows and would
      # have reproduced on this laptop in four seconds.
      #
      # The default reporter writes the tally the script below looks for, and
      # writes it the same way when redirected to a file with no TTY, which is
      # the only mode this step ever runs in.
      # Two reporters. The JSON is the MEASUREMENT and the text log is the
      # DIAGNOSTIC, and they are separate because the log cannot be trusted
      # for the former: on this runner `npm test > win.log 2>&1` produced 4,169
      # characters of a run with thousands of tests -- about the last forty
      # lines -- so the summary vitest prints at the END is exactly the part
      # most likely to be missing. Three runs in a row reported "no tally
      # line" for that reason.
      #
      # `--outputFile.json=` is written by vitest straight to disk with no
      # shell redirection in the path: no encoding surprise, no truncation,
      # and exact counts rather than a parsed sentence.
      - name: Run the suite, keeping both a tally and a log
        continue-on-error: true
        run: npm test -- --reporter=default --reporter=json --outputFile.json=win.json > win.log 2>&1

      # `if: always()` so a suite that dies mid-run is still counted -- the
      # script distinguishes "no failures" from "never got far enough to
      # count", and those must not look alike.
      - name: Report the tally
        if: always()
        run: node scripts/windows-tally.mjs win.json win.log

      # Artifacts are downloadable as soon as THIS job finishes, unlike step
      # logs, which GitHub withholds until every job in the run does. With the
      # Mac jobs running forty minutes longer, that is the difference between
      # reading the result now and reading it after it stopped mattering.
      - name: Keep the raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-result
          path: |
            win.json
            win.log
          if-no-files-found: warn
          retention-days: 7
  migrations:
    name: Migrations applied to the live database
    # ── THIS USED TO SAY "deliberately NOT following CI_RUNNER" ───────────
    #
    # It gave two reasons and both were sound: the scripts shell out to `psql`,
    # which ships on ubuntu-latest and will not be on a laptop unless somebody
    # installed it; and this is the job holding SUPABASE_DB_URL and
    # STRIPE_SECRET_KEY, which is the last place to want an environment nobody
    # can reproduce.
    #
    # What overrode both: the job stopped running at all. GitHub's HOSTED
    # allocation for this repository broke on 2026-08-10 — the same failure
    # that moved `verify` to the self-hosted runner — and this was the last job
    # left on `ubuntu-latest`. From 2026-08-12 it has been failing in two
    # seconds with `runner_id: 0`, ZERO steps and no logs at all. It never
    # receives a machine.
    #
    # That is worse than either objection above, and worse than a plain red
    # build. This is the IMP-2 gate: the check that code landing on main does
    # not depend on schema production lacks. Five merges landed while it was
    # unschedulable, six migrations were applied to the live database in that
    # window, and nothing compared the two. A hard gate that cannot start is
    # not a lenient gate — it is an absent one, and it is absent while
    # reporting failure, which is the shape that trains people to ignore it.
    #
    # ── ON THE SECRETS, PLAINLY ──────────────────────────────────────────
    #
    # Following CI_RUNNER means SUPABASE_DB_URL is decrypted on a long-lived
    # machine rather than a disposable one. That is a real change and worth
    # saying out loud rather than burying: the trade is a persistent host
    # against a gate that runs. It is the owner's own Mac, which is already
    # where that connection string lives, so this is not new exposure so much
    # as the same exposure on a box that also keeps a work directory.
    #
    # Set the repository variable `CI_RUNNER` back to empty and this returns to
    # hosted runners with no PR needed, exactly like `verify`.
    # ── THIS JOB CANNOT RUN ON WINDOWS ──────────────────────────────────
    #
    # A second self-hosted runner joined on 2026-09-16 and it is a Windows
    # machine. `CI_RUNNER` is `self-hosted`, which matches BOTH, so GitHub
    # dispatches to whichever is idle. The steps below need a Unix shell and
    # Unix tooling -- psql, Docker, the Supabase CLI, or a bash guard -- and
    # would fail on that box in a way that reads like a broken migration
    # rather than a broken match.
    #
    # `UNIX_RUNNER` is checked FIRST and set to `macOS`, a label only the Mac
    # carries. `CI_RUNNER` stays as the fallback so the existing escape hatch
    # is untouched: clear both variables and everything returns to hosted
    # runners with no edit to this file.
    #
    # ci.yml's `verify` job deliberately does NOT have this line. Every step
    # in it is `npm run` and portable, which is the point -- it is the long
    # one, and the whole reason for a second machine.
    runs-on: ${{ vars.UNIX_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Skipped on pull requests, and this costs nothing real: every step below
    # already carried `continue-on-error: ${{ github.event_name ==
    # 'pull_request' }}`, so on a PR the whole job could only ever produce
    # warnings. It was spending a runner — checkout, node, five checks — to
    # tell us something it was not allowed to fail on.
    #
    # It remains a HARD gate on main and on manual dispatch, which is where
    # the IMP-2 incident actually lives: code landing on main must not depend
    # on schema production lacks. A PR legitimately contains migrations that
    # have not been applied yet, which is why it was advisory there in the
    # first place.
    #
    # To check before merging without spending the run, the three schema
    # scripts take offline captures (--applied-from / --live-from /
    # --catalog-from). scripts/ci-local.sh documents how.
    if: github.event_name != 'pull_request'
    # IMP-2: a production incident already came from "migrations never applied
    # to the live DB". The codebase can be entirely correct while prod runs old
    # schema, and nothing surfaces it until a query fails in front of a
    # customer. This is the loud check.
    #
    # It runs on pull requests as a warning and on main as a hard gate: a PR
    # legitimately contains migrations that have not been applied yet, whereas
    # code landing on main must not depend on schema production lacks.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── FINDING psql, WHICH IS THE WHOLE REASON THIS JOB STAYED HOSTED ──
      #
      # It ships on ubuntu-latest. On a Mac it does not, and the trap is that
      # installing it is not enough either: `brew install libpq` is KEG-ONLY,
      # so it deliberately leaves psql off PATH on both architectures. Someone
      # who runs the documented install and re-runs the job still gets "psql:
      # command not found", which reads as the install having failed.
      #
      # So this looks in the places brew actually puts it rather than asking
      # anyone to edit the runner's shell profile — one `brew install libpq`
      # and nothing else. Both prefixes are checked because Apple Silicon uses
      # /opt/homebrew and Intel uses /usr/local, and a runner can move between
      # machines without this file knowing.
      #
      # It fails loudly with the exact command to run rather than letting the
      # first check die on a confusing ENOENT three steps later.
      - name: Find psql
        id: psql
        run: |
          if command -v psql >/dev/null 2>&1; then
            echo "psql on PATH: $(command -v psql)"
            exit 0
          fi
          for d in /opt/homebrew/opt/libpq/bin /usr/local/opt/libpq/bin \
                   /opt/homebrew/bin /usr/local/bin /Applications/Postgres.app/Contents/Versions/latest/bin; do
            if [ -x "$d/psql" ]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "found psql at $d/psql — added to PATH for the steps below"
              exit 0
            fi
          done
          echo "::error::psql not found on this runner, so the schema checks below cannot run."
          echo "On the self-hosted macOS runner:  brew install libpq"
          echo "No PATH edit is needed — this step looks in libpq's keg-only bin directory."
          echo "Checked: /opt/homebrew/opt/libpq/bin, /usr/local/opt/libpq/bin, /opt/homebrew/bin,"
          echo "         /usr/local/bin, /Applications/Postgres.app/Contents/Versions/latest/bin"
          exit 1

      - name: Check repo migrations against the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — the migration drift check cannot run."
            echo "Add it in repo Settings → Secrets → Actions. Until then this job fails by design:"
            echo "a check that silently passes without checking anything is the failure mode IMP-2 exists to remove."
            exit 1
          fi
          node scripts/check-migrations.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # ── EVERY CHECK BELOW CARRIES `if: always()` ───────────────────────
        #
        # This job reports FIVE independent facts about production, and until
        # now the first failure skipped the other four. That is not merely
        # inconvenient: this check says "these migrations are in the repo and
        # not in the database", and the very next one — does every object those
        # migrations create actually EXIST — is what tells you whether they
        # genuinely never ran or merely ran without being recorded. Opposite
        # problems, opposite fixes, and the run stopped one step short of
        # distinguishing them.
        #
        # The job still fails. It just says everything it knows in one run
        # rather than one finding per push.
        #
        # Gated on the psql lookup rather than a bare `always()`: with no
        # psql these would each die on a confusing ENOENT and bury the one
        # message that says what to install, which is exactly what the
        # lookup step was added to prevent.

      - name: Check the database against the repo migrations
        # The other direction. The step above asks "did production run
        # everything the repo has"; this asks "does production have something
        # the repo never wrote". Three functions had drifted in that direction
        # undetected, one of them a SECURITY DEFINER routine reachable from a
        # shipped screen — invisible until an environment gets rebuilt from the
        # repo and it simply is not there.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — the undeclared-schema check cannot run."
            exit 1
          fi
          node scripts/check-schema-declared.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # See the note on `if: always()` below the first check.
        if: always() && steps.psql.conclusion == 'success'

      - name: Check every object the migrations create still exists
        # IMP-2b. The two steps above compare NAMES: repo files against the
        # applied ledger, and live objects against declared ones. Neither can
        # see inside a file. 82 migrations are exempt from the name comparison
        # via migrations-baseline.json, whose comment claimed each was verified
        # by confirming the objects it creates exist — and seed_demo_org was
        # defined in two of those files and present in neither copy of the live
        # database for a month, with the app calling it by name the whole time.
        #
        # A per-FILE exemption has nowhere to record "five of the six functions
        # in this file landed". This step replays every CREATE and DROP across
        # every migration and asserts each surviving object is in the catalog,
        # so a half-applied migration is a failure rather than a rounding error.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — the per-object check cannot run."
            exit 1
          fi
          node scripts/check-baseline-objects.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # See the note on `if: always()` below the first check.
        if: always() && steps.psql.conclusion == 'success'

      # A function can exist, typecheck and sit in every ledger while being
      # unreachable by the role that calls it. That is how auto-routing came to
      # refuse every day for a week with "permission denied for function
      # plan_day_across_staff" while `check every object the migrations create
      # still exists` stayed green: the function IS there.
      - name: Every function the app calls, it can call
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — the RPC reachability check cannot run."
            exit 1
          fi
          node scripts/check-rpc-grants.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # See the note on `if: always()` below the first check.
        if: always() && steps.psql.conclusion == 'success'

      - name: The published app origin answers the native preflight
        # §3 item 6 of the brief listed this as two curls "only you can confirm".
        # They sat unrun, and when finally run the answer was that the
        # documented host FAILS: app.houndstack.com 307-redirects to
        # www.app.houndstack.com, and a CORS preflight may not follow a redirect
        # — so the native app pointed at it cannot call a single server
        # function. The CORS work was right; the host was wrong.
        #
        # Nothing in the repo can know that. Only the live edge can, so this
        # asks it every run instead of leaving it as a step to remember.
        run: node scripts/check-app-origin.mjs
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # See the note on `if: always()` below the first check.
        if: always() && steps.psql.conclusion == 'success'

      - name: Stripe charges what the catalog says
        # The database stores a price in cents AND a Stripe price id. The app
        # renders the cents; Stripe charges the id. Nothing compared them until
        # now, which is survivable only while the two are created together.
        #
        # It stops being survivable at the live-mode cutover: a fresh live
        # catalog is built by hand and platform_plans is repointed, and every
        # new id is a chance for the pricing page to say $79 while the card is
        # charged $199 — or for a live key to hold test ids, which does not
        # error until checkout, in front of the first paying customer.
        #
        # Exit 2 means the gate is NOT ARMED (no STRIPE_SECRET_KEY in CI yet)
        # and is reported as a warning rather than a pass, because "could not
        # check" and "checked and fine" are different answers. Exit 1 is a real
        # disagreement and fails.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set +e
          node scripts/check-stripe-catalog.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::Stripe catalog gate is NOT ARMED — add STRIPE_SECRET_KEY to repo secrets to arm it before the live-mode cutover."
            exit 0
          fi
          exit $code
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        # See the note on `if: always()` below the first check.
        if: always() && steps.psql.conclusion == 'success'

  deployment:
    name: The deployed site serves the worker it built
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # ── WHY THIS JOB EXISTS, AND WHY IT IS NOT ON PULL REQUESTS ──────────
    #
    # /sw.js answered 404 on app.houndstack.com for THREE WEEKS after the bug
    # that caused it was fixed, and nothing here noticed. The reason is worth
    # stating precisely, because it is the same shape as the IMP-2 incident
    # above and as the two OAuth gates before it: every check we had was
    # reading the ARTEFACT rather than the RUNNING THING.
    #
    #   check:pwa       reads .output/public and proves the BUILD emits a
    #                   worker with a populated precache. Green throughout,
    #                   correctly, because the build has been right since #104.
    #   this job        asks the site.
    #
    # On 2026-09-08 the build was verified correct in every way a repository
    # can be: sw.js and workbox-*.js present on disk in .output/public AND
    # listed in Nitro's embedded public-asset manifest in .output/server. Yet
    # production served 404 for both, while manifest.webmanifest and
    # push-handlers.js from the SAME directory served 200 -- and the 404 came
    # back from the SSR worker with no x-deployment-id header, meaning the
    # asset layer had no such file to serve. Whatever drops them happens in the
    # deploy, downstream of anything this repository controls.
    #
    # Which is exactly why it must be watched from here: nobody else is going
    # to notice, and the symptom is silent. Every visitor's browser calls
    # navigator.serviceWorker.register("/sw.js"), gets a 404, and the app has
    # no install prompt and no offline tolerance -- on a product whose users
    # stand in driveways with one bar of signal.
    #
    # NOT ON PULL REQUESTS, deliberately, and for a different reason than the
    # migrations job. A PR author cannot fix the deployed site: the deploy has
    # not happened yet for their change, and a red X they are powerless to
    # clear is the fastest way to teach a team to ignore a check. It is a hard
    # gate on main and on manual dispatch, where the state it describes is the
    # state somebody can actually act on.
    #
    # The script itself exits 0 when the origin cannot be reached, so a flaky
    # network or a DNS blip cannot fail this. It fails only when the site
    # ANSWERS and the worker is missing.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache on HOSTED runners only. On the self-hosted machines the
          # runner's own ~/.npm persists between jobs, so the GitHub cache adds
          # nothing -- and its POST-RUN SAVE is what has now killed three
          # otherwise-green jobs: every work step succeeds, then the save
          # crawls on a machine at 90%+ swap until the job's timeout cancels
          # it, and the check reports failure over bookkeeping. The expression
          # reads empty (= caching off) whenever a self-hosted runner variable
          # is set, and 'npm' on the hosted fallback, where a fresh VM really
          # does need the cache.
          cache: ${{ (vars.UNIX_RUNNER || vars.CI_RUNNER) == '' && 'npm' || '' }}

      - run: npm ci

      - name: Does the deployed site serve /sw.js
        run: npm run check:pwa:live
