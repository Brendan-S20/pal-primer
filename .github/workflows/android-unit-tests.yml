name: Android unit tests

# ── WHAT THIS DOES ──────────────────────────────────────────────────────────
#
# Runs the Android project's JVM unit tests: `./gradlew testDebugUnitTest`.
# No device, no emulator, no signing key, no upload. Today that is mainly the
# in-app rating prompt's FakeReviewManager path (issue #521,
# android/app/src/testDebug/.../ReviewFlowTest.java): request then launch,
# once each, and a failed request swallowed.
#
# Then it builds the RELEASE APK, unsigned, and fails if any of the debug-only
# review classes made it in. tests/the-fake-review-manager-stays-out-of-release.test.ts
# pins the same wall from the source side; this checks the artifact.
#
# The instrumented test beside it (src/androidTest, connectedDebugAndroidTest)
# needs a device and is NOT run here. See docs/android-rating-prompt-qa.md.
#
# Nothing here reads a secret. The release build is unsigned on purpose (no
# keystore is configured, which android/app/build.gradle allows) and is
# thrown away with the runner.

on:
  pull_request:
    paths:
      - "android/**"
      - "src/lib/rating-prompt*.ts"
      - "package-lock.json"
      - ".github/workflows/android-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/lib/rating-prompt*.ts"
      - "package-lock.json"
      - ".github/workflows/android-unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-unit-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  jvm:
    name: JVM unit tests (no device)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      # The Capacitor plugins' Android sources live in node_modules, and
      # android/capacitor-cordova-android-plugins is generated by `cap sync`.
      # No web build is needed to run JVM tests, so an empty webDir stands in.
      - run: npm ci
      - name: Generate the Capacitor Android project
        run: |
          mkdir -p dist-native/client
          [ -f dist-native/client/index.html ] || echo '<!doctype html><title>ci</title>' > dist-native/client/index.html
          npx cap sync android

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Prove the release APK carries none of the debug review classes
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$apk" ] || { echo "no release APK was built"; exit 1; }
          found="$(unzip -p "$apk" 'classes*.dex' | grep -a -o -E 'consulting/thenorth/houndstack/review/[A-Za-z]+|HoundStackFakeReview' | sort -u || true)"
          if [ -n "$found" ]; then
            echo "::error::Debug-only review classes are in the release APK:"
            echo "$found"
            exit 1
          fi
          echo "Release APK: no FakeReviewPlugin, FakeReviewInstaller, FailingReviewManager or ReviewFlow."

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/
          retention-days: 7
