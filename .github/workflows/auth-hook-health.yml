name: Auth hook health

# ── WHY THIS EXISTS (#764) ──────────────────────────────────────────────────
#
# From about 2026-08-10 to 2026-11-09 every Supabase Auth email (password
# reset, email change, magic link) was undeliverable: the LIVE Send Email hook
# URI pointed at www.app.houndstack.com, which had stopped resolving. The code
# and every env var already said app.houndstack.com, so nothing that read the
# repo could see it. Only the live setting could.
#
# So this reads the live Auth config once a day (Management API, GET only) and
# fails when the send-email hook is not exactly
# https://app.houndstack.com/email/auth/webhook, or when any enabled hook's
# host does not resolve or its route does not answer. A failed scheduled run
# is GitHub's email to whoever last edited this schedule — that is the alert.
#
# Needs the repo secret SUPABASE_ACCESS_TOKEN (a Management API token). Without
# it the step FAILS (exit 2) rather than skipping: a daily check that quietly
# stops checking is exactly the three months this exists to prevent.
#
# The token is passed in env only, never echoed; the script prints hook names
# and scheme://host/path, never the token or the config body.

on:
  schedule:
    # 13:17 UTC daily: daytime in the US, off the hour.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-hook-health
  cancel-in-progress: true

jobs:
  live-hooks:
    name: Live Supabase Auth hooks resolve and answer
    runs-on: ${{ vars.UNIX_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node built-ins only; no npm install needed.
      - name: The live send-email hook is the expected URI, and every enabled hook answers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-auth-hook-hosts.mjs --live
