# The Android release number. Read by android/app/build.gradle.
#
# VERSION_CODE is the one Play enforces: every bundle uploaded to ANY track
# must carry a higher number than every bundle it has accepted before. Bump it
# with `npm run android:bump` before each `npm run android:bundle` you intend
# to upload, and commit the change, so the number in git is the number on
# Play.
#
# VERSION_NAME is what a person sees in the store listing and in Settings >
# Apps. Keep it in step with MARKETING_VERSION in the iOS project.
VERSION_CODE=2
VERSION_NAME=1.0
