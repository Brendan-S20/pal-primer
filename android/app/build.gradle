apply plugin: 'com.android.application'

// ── RELEASE SIGNING, WITH NO SECRET IN THE REPO ─────────────────────────────
//
// Play takes a SIGNED Android App Bundle. This file reads the upload key's
// location and passwords from one of two places, and from nowhere else:
//
//   1. android/keystore.properties (gitignored; copy keystore.properties.example)
//        storeFile=/absolute/path/outside/the/repo/houndstack-upload.jks
//        storePassword=...
//        keyAlias=upload
//        keyPassword=...
//   2. environment variables, which win over the file when both are set:
//        ANDROID_KEYSTORE_PATH  ANDROID_KEYSTORE_PASSWORD
//        ANDROID_KEY_ALIAS      ANDROID_KEY_PASSWORD
//
// When none of that is present the release build type is left UNSIGNED rather
// than failing, so `assembleDebug`, a fresh checkout and CI all keep building.
// An unsigned bundle is still a bundle; Play refuses it at upload. The
// configure-time warning at the bottom of this file says so first, and
// android/build-debug.sh prints "Signed: NO" after a bundleRelease.
//
// The key this signs with is the UPLOAD key. With Play App Signing (the
// default for a new app, and the recommendation in docs/play-store-submission.md)
// Google holds the app signing key, so a lost upload key is a support ticket
// and not a lost app. Keep the .jks OUTSIDE this directory, not merely out of
// git: .gitignore covers *.jks and *.keystore, but a file in the tree is one
// archive or copy-paste away from leaving the machine.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    def fromEnv = System.getenv(envName)
    (fromEnv != null && !fromEnv.trim().isEmpty()) ? fromEnv.trim() : keystoreProps.getProperty(propName)?.trim()
}
def releaseStoreFile = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
if (hasReleaseSigning && !file(releaseStoreFile).exists()) {
    // Named, not silently skipped: a typo in the path would otherwise produce
    // an unsigned bundle from a machine where somebody believed it was signed.
    throw new GradleException("Release signing is configured but the keystore does not exist: ${releaseStoreFile}")
}

// ── VERSION: versionCode MUST GO UP ON EVERY UPLOAD ─────────────────────────
//
// Play rejects a bundle whose versionCode is not higher than every one it has
// already accepted, on any track. So the number is explicit and lives in ONE
// committed file, android/version.properties, bumped by `npm run android:bump`
// (which prints the new value). An override for a one-off or CI build:
// ANDROID_VERSION_CODE / ANDROID_VERSION_NAME.
//
// Not derived from a timestamp or a git count, deliberately. Either would go
// up on its own, and both make "which build is on the internal track" a
// question about arithmetic instead of a number you can read in a file.
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: versionProps.getProperty('VERSION_CODE', '1')).trim().toInteger()
def appVersionName = (System.getenv('ANDROID_VERSION_NAME') ?: versionProps.getProperty('VERSION_NAME', '1.0')).trim()

// ── IN-APP RATING PROMPT, DEBUG/QA ONLY (issue #521) ────────────────────────
//
// Play's review sheet never appears on a debug or sideloaded build, so the
// rating prompt is invisible to QA. A DEBUG build made with
//   ./gradlew assembleDebug -Phoundstack.fakeReview=on     (or =fail)
// (or HOUNDSTACK_FAKE_REVIEW=on in the environment) registers a plugin that
// runs Play's FakeReviewManager and shows a toast when the sheet would appear.
// See docs/android-rating-prompt-qa.md.
//
// OFF unless asked for, and RELEASE IS ALWAYS "off": the release BuildConfig
// field is a literal, the plugin's classes live in src/debug only, and
// tests/the-fake-review-manager-stays-out-of-release.test.ts pins all three.
def fakeReviewFlag = (findProperty('houndstack.fakeReview') ?: System.getenv('HOUNDSTACK_FAKE_REVIEW') ?: 'off').toString().trim().toLowerCase()
if (!(fakeReviewFlag in ['off', 'on', 'fail'])) {
    throw new GradleException("houndstack.fakeReview must be off, on or fail, not '${fakeReviewFlag}'")
}

android {
    namespace = "consulting.thenorth.houndstack"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "consulting.thenorth.houndstack"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        // FakeReviewManager builds an Intent; on the JVM the stub android.jar
        // returns defaults instead of throwing "not mocked". Unit tests only.
        unitTests.returnDefaultValues = true
    }
    buildTypes {
        debug {
            buildConfigField "String", "FAKE_REVIEW_MANAGER", "\"${fakeReviewFlag}\""
        }
        release {
            buildConfigField "String", "FAKE_REVIEW_MANAGER", "\"off\""
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // FakeReviewManager ships inside Play's review artifact. Debug and test
    // classpaths only: release keeps getting it solely through
    // @capacitor-community/in-app-review, as before (issue #521).
    debugImplementation "com.google.android.play:review:$googleAndroidPlayReviewVersion"
    testDebugImplementation "com.google.android.play:review:$googleAndroidPlayReviewVersion"
    // FakeReviewManager.requestReviewFlow() wraps PendingIntent.getBroadcast,
    // which the JVM's stub android.jar answers with null. One static mock
    // gives it a PendingIntent, so the JVM test needs no emulator or Robolectric.
    testDebugImplementation "org.mockito:mockito-core:$mockitoVersion"
    androidTestImplementation "com.google.android.play:review:$googleAndroidPlayReviewVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase, for FCM push. Capacitor's template, kept as generated, and it does
// the right thing: the google-services plugin is applied ONLY when
// android/app/google-services.json exists (file().text throws when it does
// not, and the catch logs and moves on), so a checkout without one still
// builds. The web bundle has its own half of this gate -- FCM_CONFIGURED in
// src/lib/native-build.ts, set by vite.config.ts from the same file -- because
// a binary that registers for push with no Firebase app CRASHES rather than
// failing softly (docs/android-generated.md, "The crash the first run found").
// So place the file BEFORE `npm run build:native`, not after.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Say it at configure time, once, when a release task is about to produce
// something Play will refuse. Debug builds never see this.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(bundle|assemble)Release/ }
    if (wantsRelease && !hasReleaseSigning) {
        logger.warn("""
WARNING: building a RELEASE artifact with no signing config. It will be UNSIGNED
and Google Play will refuse it. Create android/keystore.properties (see
android/keystore.properties.example) or set ANDROID_KEYSTORE_PATH,
ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
""")
    }
}
