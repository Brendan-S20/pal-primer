project_id = "vsxzrbxublqrcfnxfwcu"

# ── WHY THIS PROJECT DOES NOT USE THE DEFAULT PORTS ────────────────────────
#
# The Supabase CLI defaults to 54321-54327 for every project on a machine, so
# two projects cannot have a stack up at once. That is not hypothetical here:
# another project's stack (ref eqzmqxtngbulzhimrymr) runs on this development
# machine, Docker restarts it automatically at login, and it holds those ports.
#
# The database job in .github/workflows/sandboxes.yml failed on exactly that
# for two days running:
#
#     Bind for 0.0.0.0:54322 failed: port is already allocated
#
# and it is the only check that can answer whether these migrations BUILD a
# database rather than merely agree with one, so losing it is expensive.
#
# The other fix was "stop the other project's stack", which works until the
# next reboot and asks a person to remember. This asks nobody to remember.
# 544xx rather than 543xx: one digit off the default, so the mapping stays
# obvious. 545xx is TAKEN: the database job in sandboxes.yml rewrites its own
# checkout's copy of this file to 54521-54527 (and project_id to "<id>-ci"),
# so CI and `npm run test:e2e` can run at the same time on the one machine
# that hosts both. A third project on this machine should take 546xx.
[api]
port = 54421

[db]
port = 54422
shadow_port = 54420

[studio]
port = 54423

[local_smtp]
port = 54424

[analytics]
port = 54427

# ── WHY PRODUCTION SKIPS MIGRATIONS WHEN THE SUPABASE INTEGRATION RUNS (#741) ─
#
# On every main commit the Supabase GitHub integration's "Supabase Preview"
# check compares production's migration ledger against supabase/migrations/
# BY VERSION NUMBER, and has failed every time with:
#
#     Remote migration versions not found in local migrations directory.
#
# It can never pass the way this repo works. Migrations reach production
# through Lovable and the MCP apply tool, and both stamp a NEW version when
# they apply a file — so a file named 20261108153700_x.sql shows up in the
# ledger as some other 14-digit number with the name x. As of 2026-11-08 the
# ledger held 474 versions and 389 of them matched no file name. Every new
# migration adds one more. scripts/check-migrations.mjs compares by NAME for
# exactly this reason, and it (plus check-baseline-objects.mjs) is the drift
# check this repo trusts.
#
# This block tells the integration NOT to run migrations against production.
# That is all it does:
#
#   * It matches only when the CLI's TARGET is this hosted project ref: the
#     integration's production deploy, or a command run with --linked against
#     it. `supabase start` and `supabase db reset` against the LOCAL stack have
#     no target ref and ignore it, so the empty-database replay that the
#     sandboxes.yml database job and `npm run test:e2e` do is unchanged.
#   * Preview branches for PRs are their own projects with their own refs,
#     start empty and replay every file; this block does not match them.
#   * It declares nothing else, on purpose. Supabase's branching docs say a
#     [remotes.*] block whose project_id matches also turns on the
#     integration's "Configure" step for that project. The current CLI's
#     `config push` writes only properties the file DECLARES, and this file
#     declares local ports and this one switch, none of them a hosted setting.
#     Whether the integration's runner behaves the same cannot be read from
#     the repo: `supabase config diff` against the linked project shows what
#     it would push, and it only reads. Do not add [remotes.production.auth]
#     or similar here without running it.
#
# `project_id` is indented so the sandboxes.yml step that rewrites the
# top-level `^project_id = ` line (for an isolated CI stack) can never match
# this one instead. tests/production-is-migrated-by-name-not-by-the-integration.test.ts
# pins all of the above.
[remotes.production]
  project_id = "vsxzrbxublqrcfnxfwcu"

[remotes.production.db.migrations]
  enabled = false
